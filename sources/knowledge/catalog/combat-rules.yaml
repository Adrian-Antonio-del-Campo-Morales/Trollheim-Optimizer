    {
      "id": "combat-modificaciones-prioritarias-del-reglamento",
      "kind": "combat_rule",
      "name": "Modificaciones prioritarias del reglamento",
      "rule_summary": "- Quien carga obtiene `Ataca primero` durante la primera ronda.\n- Varias reglas `Ataca primero` se ordenan por Iniciativa; después atacan los\n  combatientes normales por Iniciativa y finalmente quienes `Atacan último`.\n- La lanza `Ataca primero` en la primera ronda y solo admite escudo o rodela\n  en la otra mano.\n- El Látigo de Acero sustituye Alcance por Latigazo: +1 A al cargar; al ser\n  cargado el ataque adicional contra quien carga es el único que Ataca primero.\n- `Experto en Esgrima` no funciona con espadas a dos manos ni otras armas.\n- `Reflejos Felinos`: al recibir una carga obtiene `Ataca primero`; el orden\n  contra quienes también atacan primero se decide por Iniciativa.\n- `En Pie de un Salto`: ignora Derribado salvo cuando lo causa una salvación de\n  casco o la regla `Sin dolor`.",
      "source": "`trollheim.pdf`, Modificaciones del Reglamento de Mordheim, pp. impresas 28, 34, 42, 85, 122 y 123.",
