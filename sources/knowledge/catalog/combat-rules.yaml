      "id": "combat-secuencia-del-duelo",
      "kind": "combat_rule",
      "name": "Secuencia del duelo",
      "rule_summary": "1. En la primera ronda ataca antes quien carga.\n2. Si ambos tienen la misma prioridad, se compara la Iniciativa.\n3. Las reglas `Ataca primero` y `Ataca último` alteran ese orden.\n4. Cada ataque tira para impactar, herir, salvar y, si se pierde la última\n   Herida, determina el estado del defensor.",
      "source": "`trollheim.pdf`, pp. 34-37 y 167.",
      "transcription": "summary",
      "implemented": null
    },
    {
      "id": "combat-tirada-para-impactar",
      "kind": "combat_rule",
      "name": "Tirada para impactar",
      "rule_summary": "Se compara HA del atacante contra HA del defensor:\n\n| Relación | Resultado necesario |\n|---|---:|\n| HA atacante mayor | 3+ |\n| HA defensora mayor que el doble de la atacante | 5+ |\n| Resto | 4+ |\n| Defensor con HA 0 | 2+ |",
      "source": "`trollheim.pdf`, pp. 35 y 167.",
      "transcription": "summary",
      "implemented": null
    },
    {
      "id": "combat-combatir-con-dos-armas",
      "kind": "combat_rule",
      "name": "Combatir con dos armas",
      "rule_summary": "Un arma de una mano en cada mano concede un ataque adicional. Cada ataque usa\nlas reglas del arma con la que se realiza. Las armas a dos manos, los pares de\narmas indivisibles y otras armas marcadas como incompatibles anulan la mano\nsecundaria.",
      "source": "`trollheim.pdf`, p. 35.",
      "transcription": "summary",
      "implemented": null
    },
