      "kind": "combat_rule",
      "name": "Impactos críticos",
      "rule_summary": "Un 6 natural para herir produce crítico si no era necesario un 6 para herir.\nSolo puede causarse un crítico por combatiente y fase.\n\n| 1D6 | Efecto |\n|---|---|\n| 1-2 | Dos heridas; permite armadura. |\n| 3-4 | Dos heridas; ignora armadura. |\n| 5-6 | Dos heridas; ignora armadura y +2 a la tirada de Heridas. |",
      "source": "`trollheim.pdf`, pp. 32 y 167. El reglamento también presenta tablas\nopcionales de críticos por tipo de arma en la p. 161.",
