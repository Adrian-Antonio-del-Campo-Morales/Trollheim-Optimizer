      "id": "combat-tirada-para-herir",
      "kind": "combat_rule",
      "name": "Tirada para herir",
      "rule_summary": "| Fuerza respecto a Resistencia | Resultado necesario |\n|---|---:|\n| F >= R + 2 | 2+ |\n| F = R + 1 | 3+ |\n| F = R | 4+ |\n| F = R - 1 | 5+ |\n| F entre R - 2 y R - 3 | 6+ |\n| F <= R - 4 | Imposible |",
      "source": "`trollheim.pdf`, pp. 31-32 y 167.",
      "transcription": "summary",
      "implemented": null
    },
