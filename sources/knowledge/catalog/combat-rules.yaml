    {
      "id": "combat-tabla-de-heridas-y-recuperacion",
      "kind": "combat_rule",
      "name": "Tabla de Heridas y recuperación",
      "rule_summary": "| 1D6 al perder la última Herida | Estado |\n|---|---|\n| 1-2 | Derribado |\n| 3-4 | Aturdido |\n| 5-6 | Fuera de combate |\n\nUn aturdido pasa a derribado y después se levanta. Quien se levanta ataca\núltimo esa ronda. Un enemigo aturdido queda fuera de combate al ser atacado;\nun derribado recibe impactos automáticos y queda fuera si sufre una herida no\nsalvada. No se puede derribar y rematar con los ataques restantes del mismo\ncombatiente en la misma fase.",
      "source": "`trollheim.pdf`, pp. 33 y 37.",
      "transcription": "summary",
      "implemented": null
    },
    {
      "id": "combat-parada",
