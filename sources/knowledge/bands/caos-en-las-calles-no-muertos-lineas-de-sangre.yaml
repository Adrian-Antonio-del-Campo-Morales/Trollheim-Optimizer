band_rules:
  - id: choose-bloodline
    name: Creación de la banda
    effect: Debe escogerse exactamente uno de los cinco perfiles de Vampiro como líder y el linaje no puede cambiar. No puede contratarse otro Vampiro salvo como personaje dramático o espada de alquiler. Con Strigoi se aplican los costes alternativos y puede incluirse un Carroñero.
    source: {manual: caos-en-las-calles, printed_page: 173, section: Reglas Especiales de los No Muertos}
  - id: vampiric-powers
    name: Poderes Vampíricos
    effect: Al obtener una nueva habilidad, el Vampiro puede escoger un poder de su propio linaje en lugar de una habilidad normal.
    source: {manual: caos-en-las-calles, printed_page: 173, section: Reglas Especiales de los No Muertos}
  - {id: hypnotic-gaze, name: Mirada Hipnótica, effect: Una vez por turno un enemigo en contacto chequea Liderazgo base; si falla no ataca ese turno y todos los ataques contra él impactan automáticamente. No afecta a inmunes a psicología., source: {manual: caos-en-las-calles, printed_page: 181, section: Poderes Von Carstein y Lahmia}}
  - {id: dark-majesty, name: Aura de Majestad Oscura, effect: Aumenta 15 cm el alcance de Jefe y permite repetir chequeos de retirada fallidos mientras el Vampiro siga en juego., source: {manual: caos-en-las-calles, printed_page: 181, section: Poderes Von Carstein}}
  - {id: summon-bats, name: Llamar a los Murciélagos, effect: Una vez por batalla invoca automáticamente 1D3 Murciélagos Vampiro a 15 cm. Perfil M5 HA3 HP0 F3 R3 H2 I3 A2 L5; vuelan 50 cm, causan miedo, son inmunes a psicología y venenos, consideran aturdido como derribado y no corren. Solo cargan blancos visibles. Si pierden su última herida quedan fuera de combate sin Heridas Graves. Abandonan si se alejan del aura de Jefe y desaparecen si el Vampiro es baja., source: {manual: caos-en-las-calles, printed_page: 181, section: Poderes Von Carstein}}
  - {id: summon-storm, name: Invocar la Tormenta, effect: Una vez por batalla al inicio de disparos tira 1D6; con 1 falla y con 2-6 dura hasta el siguiente turno del Vampiro. Los disparos sufren menos uno y nadie puede volar. Termina si el Vampiro es herido o entra en combate., source: {manual: caos-en-las-calles, printed_page: 181, section: Poderes Von Carstein}}
  - {id: red-fury, name: Furia Roja, effect: Obtiene más un Ataque sin contar para el máximo del perfil., source: {manual: caos-en-las-calles, printed_page: 182, section: Poderes Dragón Sangriento}}
  - {id: sword-master, name: Maestro de la Espada, effect: Al parar basta igualar la tirada enemiga y puede repetir una parada fallida, pero no una segunda vez ni más de un ataque., source: {manual: caos-en-las-calles, printed_page: 182, section: Poderes Dragón Sangriento}}
  - {id: infallible, name: Infalible, effect: Puede repetir la tirada para impactar cuando carga., source: {manual: caos-en-las-calles, printed_page: 182, section: Poderes Dragón Sangriento}}
  - {id: steel-strength, name: Fuerza del Acero, effect: Obtiene más uno a Fuerza durante el turno en que carga, sin contar para el máximo., source: {manual: caos-en-las-calles, printed_page: 182, section: Poderes Dragón Sangriento}}
  - {id: empyrean-eye, name: Foco Empíreo, effect: Una vez por batalla puede repetir una tirada fallida de hechizo., source: {manual: caos-en-las-calles, printed_page: 182, section: Poderes Necrarca}}
  - {id: black-arts-master, name: Maestro de las Artes Negras, effect: Aumenta 15 cm el alcance de sus hechizos que tengan alcance., source: {manual: caos-en-las-calles, printed_page: 182, section: Poderes Necrarca}}
  - {id: awakening, name: El Despertar, effect: Una vez por turno puede lanzar Reanimación además de otro hechizo; alternativamente, en vez de lanzar hechizos ese turno invoca 1D3 Zombis a 15 cm. Desaparecen después de la partida y no cuentan para límite ni retirada., source: {manual: caos-en-las-calles, printed_page: 182, section: Poderes Necrarca}}
  - {id: nehekhara-noble-blood, name: Sangre Noble de Nehekhara, effect: Aprende un hechizo adicional y obtiene más uno a sus tiradas de lanzamiento, acumulable con Hechicería., source: {manual: caos-en-las-calles, printed_page: 182, section: Poderes Necrarca}}
  - {id: deceive, name: Engañar, effect: Una vez por turno un enemigo en contacto chequea Liderazgo base; si falla no puede atacar a la Vampira, aunque puede atacar a otra miniatura. No afecta a inmunes a psicología., source: {manual: caos-en-las-calles, printed_page: 183, section: Poderes Lahmia}}
  - {id: seduction, name: Seducción, effect: En cada turno de la Vampira un enemigo masculino en contacto chequea Liderazgo base; si falla queda controlado inmediatamente. Se libera si la banda Lahmia lo ataca y puede recuperar el control en cada recuperación. Solo puede controlar uno y no afecta a inmunes a psicología, No Muertos, Demonios ni Estúpidos., source: {manual: caos-en-las-calles, printed_page: 183, section: Poderes Lahmia}}
  - {id: lost-innocence, name: Inocencia Pérdida, effect: Siempre Ataca Primero cuerpo a cuerpo, incluso al levantarse o contra lanzas y armas equivalentes., source: {manual: caos-en-las-calles, printed_page: 183, section: Poderes Lahmia}}
  - {id: reborn-curse, name: Maldición del Renacido, effect: Regenera cada herida no salvada con 4+. No funciona contra fuego, Agua Bendita u objetos bendecidos., source: {manual: caos-en-las-calles, printed_page: 183, section: Poderes Strigoi}}
  - {id: monstrosity, name: Monstruosidad, effect: Obtiene más una Herida sin contar para el máximo del perfil., source: {manual: caos-en-las-calles, printed_page: 183, section: Poderes Strigoi}}
  - {id: iron-tendons, name: Tendones de Hierro, effect: Obtiene más uno a Fuerza sin contar para el máximo del perfil., source: {manual: caos-en-las-calles, printed_page: 183, section: Poderes Strigoi}}
  - {id: infinite-hatred, name: Odio Infinito, effect: Puede repetir las tiradas fallidas para impactar, respetando que una tirada solo puede repetirse una vez., source: {manual: caos-en-las-calles, printed_page: 183, section: Poderes Strigoi}}
