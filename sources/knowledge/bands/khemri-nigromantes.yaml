id: khemri-nigromantes
name: Nigromantes
source: {manual: khemri, printed_page: 52-56, section: Nigromantes}
roster:
  minimum_models: 3
  maximum_models: 15
  starting_gold: 500
  members:
    - {profile_id: necromancer-master, minimum: 1, maximum: 1}
    - {profile_id: necromancer-apprentice, minimum: 0, maximum: 1}
    - {profile_id: necromancer-tomb-robber, minimum: 0, maximum: 3}
    - {profile_id: necromancer-skeleton, minimum: 0, maximum: null}
    - {profile_id: necromancer-vulture, minimum: 0, maximum: 5}
    - {profile_id: necromancer-abomination, minimum: 0, maximum: 1}
equipment_lists:
  - id: necromancer-equipment
    name: Equipo para Nigromantes
    source: {manual: khemri, printed_page: 53, section: Lista de equipo para Nigromantes}
    items:
      - {item_id: yambiya, cost: 2, notes: La primera es gratis}
      - {item_id: mace, cost: 3}
      - {item_id: katar, cost: 5}
      - {item_id: scythe, cost: 5}
      - {item_id: sword, cost: 10}
      - {item_id: whip, cost: 10}
      - {item_id: ankus, cost: 13}
      - {item_id: scimitar, cost: 15}
      - {item_id: cutlass, cost: 15}
      - {item_id: short_bow, cost: 5}
      - {item_id: bow, cost: 10}
      - {item_id: shield, cost: 5}
      - {item_id: buckler, cost: 5}
      - {item_id: helmet, cost: 10}
      - {item_id: light_armour, cost: 20}
  - id: necromancer-undead-equipment
    name: Equipo de los Guerreros No Muertos
    source: {manual: khemri, printed_page: 53, section: Lista de equipo de los Guerreros No-Muertos}
    items:
      - {item_id: yambiya, cost: 2, notes: La primera es gratis}
      - {item_id: mace, cost: 3}
      - {item_id: katar, cost: 5}
      - {item_id: scythe, cost: 5}
      - {item_id: sword, cost: 10}
      - {item_id: whip, cost: 10}
      - {item_id: ankus, cost: 13}
      - {item_id: scimitar, cost: 15}
      - {item_id: cutlass, cost: 15}
      - {item_id: great_weapon, cost: 15}
      - {item_id: great_scimitar, cost: 20}
      - {item_id: short_bow, cost: 5}
      - {item_id: bow, cost: 10}
      - {item_id: long_bow, cost: 15}
      - {item_id: shield, cost: 5}
      - {item_id: buckler, cost: 5}
      - {item_id: helmet, cost: 10}
      - {item_id: light_armour, cost: 20}
      - {item_id: heavy_armour, cost: 50}
profiles:
  - id: necromancer-master
    name: Maestro Nigromante
    type: hero
    cost: 60
    experience: 20
    characteristics: {M: 10, WS: 3, BS: 4, S: 3, T: 3, W: 1, I: 3, A: 1, Ld: 8}
    equipment_lists: [necromancer-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: [shooting, academic]
    rules:
      - {id: necromancer-leader, name: Jefe, effect: Cualquier miembro de la banda a 15 cm o menos puede utilizar su Liderazgo., source: {manual: khemri, printed_page: 54, section: Maestro Nigromante}}
      - {id: necromancer-spellcaster, name: Hechicero, effect: Empieza con un hechizo de Nigromancia; las reglas de hechizos quedan fuera del alcance canónico actual., source: {manual: khemri, printed_page: 54, section: Maestro Nigromante}}
      - {id: necromancer-death, name: Fallecimiento del Nigromante, effect: Si muere, el Aprendiz reúne sus escritos y se convierte en Nigromante. Solo ellos mantienen a los no muertos; si ambos mueren, todos los no muertos desaparecen., source: {manual: khemri, printed_page: 54, section: Maestro Nigromante}}
    source: {manual: khemri, printed_page: 54, section: Maestro Nigromante}
  - id: necromancer-apprentice
    name: Aprendiz
    type: hero
    cost: 30
    experience: 0
    characteristics: {M: 10, WS: 2, BS: 3, S: 3, T: 3, W: 1, I: 3, A: 1, Ld: 7}
    equipment_lists: [necromancer-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: [shooting, academic, speed]
    rules:
      - {id: necromancer-student, name: Estudiante, effect: No empieza con hechizos; puede adquirir uno generado al azar de Nigromancia cuando obtenga una nueva habilidad. Los hechizos quedan fuera del alcance canónico actual., source: {manual: khemri, printed_page: 54, section: Aprendiz}}
    source: {manual: khemri, printed_page: 54, section: Aprendiz}
  - id: necromancer-tomb-robber
    name: Ladrón de Tumbas
    type: hero
    cost: 45
    experience: 11
    characteristics: {M: 10, WS: 4, BS: 3, S: 3, T: 3, W: 1, I: 4, A: 1, Ld: 7}
    equipment_lists: [necromancer-undead-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: [combat, strength, speed]
    rules:
      - {id: necromancer-disarm-traps, name: Desactivar Trampas, effect: Es experto en detectar y desactivar trampas; se aplica conforme a las reglas de experiencia correspondientes., source: {manual: khemri, printed_page: 54, section: Ladrones de Tumbas}}
    source: {manual: khemri, printed_page: 54, section: Ladrones de Tumbas}
  - id: necromancer-skeleton
    name: Guerrero Esqueleto
    type: henchman
    cost: 20
    experience: 0
    characteristics: {M: 10, WS: 2, BS: 2, S: 3, T: 3, W: 1, I: 2, A: 1, Ld: 5}
    equipment_lists: [necromancer-undead-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: []
    rules: [{id: necromancer-undead-skeleton, name: No Muerto, effect: Sigue todas las reglas especiales de los No Muertos de esta banda., source: {manual: khemri, printed_page: 55, section: Guerrero Esqueleto}}]
    source: {manual: khemri, printed_page: 55, section: Guerrero Esqueleto}
  - id: necromancer-vulture
    name: Buitre de Nehekhara
    type: henchman
    cost: 20
    experience: 0
    characteristics: {M: 20, WS: 2, BS: 0, S: 3, T: 3, W: 1, I: 2, A: 1, Ld: 5}
    equipment_lists: []
    fixed_equipment: [pico afilado]
    equipment_restrictions: [No puede usar armas ni armaduras]
    skill_access: []
    rules:
      - {id: necromancer-undead-vulture, name: No Muerto, effect: Sigue todas las reglas especiales de los No Muertos de esta banda., source: {manual: khemri, printed_page: 55, section: Buitres de Nehekhara}}
      - {id: necromancer-vulture-flight, name: Vuelo, effect: Se mueve sin impedimentos de terreno y puede cargar a cualquier objetivo visible sin restricciones de altura ni interceptores. Los disparos contra él sufren -1 para impactar., source: {manual: khemri, printed_page: 55, section: Buitres de Nehekhara}}
      - {id: necromancer-vulture-fragile, name: Frágil, effect: Al sufrir una herida usa 1-3 Derribado y 4-6 Fuera de combate; el resultado Derribado incluye Insensible al Dolor., source: {manual: khemri, printed_page: 55, section: Buitres de Nehekhara}}
    source: {manual: khemri, printed_page: 55, section: Buitres de Nehekhara}
  - id: necromancer-abomination
    name: Abominación Nigromántica
    type: henchman
    cost: 200
    experience: 0
    characteristics: {M: 10, WS: 3, BS: 0, S: 4, T: 4, W: 3, I: 2, A: 2, Ld: 6}
    equipment_lists: [necromancer-undead-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: []
    rules:
      - {id: necromancer-undead-abomination, name: No Muerto, effect: Sigue todas las reglas especiales de los No Muertos de esta banda., source: {manual: khemri, printed_page: 55, section: Abominación Nigromántica}}
      - {id: necromancer-abomination-unhideable, name: Imposible de Ocultar, effect: No puede ocultarse., source: {manual: khemri, printed_page: 55, section: Abominación Nigromántica}}
      - {id: necromancer-abomination-large, name: Grande, effect: Se puede disparar contra ella aunque no sea el objetivo más cercano., source: {manual: khemri, printed_page: 55, section: Abominación Nigromántica}}
      - {id: necromancer-abomination-upkeep, name: Mantenimiento, effect: El Nigromante paga 15 coronas después de cada batalla., source: {manual: khemri, printed_page: 55, section: Abominación Nigromántica}}
      - {id: necromancer-abomination-evolution, name: Constante Evolución, effect: Gana experiencia por las modificaciones del Nigromante. Al desarrollar tira en su tabla de modificaciones; cada modificación solo puede obtenerse una vez y debe pagarse su coste suplementario., source: {manual: khemri, printed_page: 55, section: Abominación Nigromántica}}
    source: {manual: khemri, printed_page: 55, section: Abominación Nigromántica}
band_rules:
  - {id: necromancer-undead-fear, name: Causan Miedo, effect: Los No Muertos causan miedo., source: {manual: khemri, printed_page: 53, section: Reglas especiales de los No Muertos}}
  - {id: necromancer-undead-psychology, name: Inmune a Psicología, effect: Los No Muertos no se ven afectados por la psicología y nunca abandonan un combate., source: {manual: khemri, printed_page: 53, section: Reglas especiales de los No Muertos}}
  - {id: necromancer-undead-pain, name: Insensible al Dolor, effect: Los No Muertos consideran Aturdido como Derribado en la tabla de heridas., source: {manual: khemri, printed_page: 53, section: Reglas especiales de los No Muertos}}
  - {id: necromancer-undead-no-run, name: No Pueden Correr, effect: No pueden correr, aunque sí cargar normalmente., source: {manual: khemri, printed_page: 53, section: Reglas especiales de los No Muertos}}
  - {id: necromancer-undead-poison, name: Inmune a Venenos, effect: Los venenos no les afectan., source: {manual: khemri, printed_page: 53, section: Reglas especiales de los No Muertos}}
  - {id: necromancer-undead-brainless, name: Sin Cerebro, effect: Nunca ganan experiencia., source: {manual: khemri, printed_page: 53, section: Reglas especiales de los No Muertos}}
  - {id: necromancer-undead-no-drink, name: No Beben, effect: No necesitan alimento ni agua; el Nigromante y demás seres vivos de la banda sí siguen las reglas normales., source: {manual: khemri, printed_page: 53, section: Reglas especiales de los No Muertos}}
  - {id: necromancer-mod-ogre-flesh, name: Carne de Ogro, effect: Modificación 2 en 2D6; cuesta 25 coronas y concede +1 Herida a la Abominación., source: {manual: khemri, printed_page: 56, section: Tabla de Modificaciones Nigrománticas}}
  - {id: necromancer-mod-bone-armour, name: Armadura de Hueso, effect: Modificación 3 en 2D6; cuesta 35 coronas y concede +1 Resistencia a la Abominación., source: {manual: khemri, printed_page: 56, section: Tabla de Modificaciones Nigrománticas}}
  - {id: necromancer-mod-strength, name: Fuerza Descomunal, effect: Modificación 4 en 2D6; cuesta 30 coronas y concede +1 Fuerza a la Abominación., source: {manual: khemri, printed_page: 56, section: Tabla de Modificaciones Nigrománticas}}
  - {id: necromancer-mod-precision, name: Precisión del Asesino, effect: Modificación 5 en 2D6; cuesta 20 coronas y concede +1 HA a la Abominación., source: {manual: khemri, printed_page: 56, section: Tabla de Modificaciones Nigrománticas}}
  - {id: necromancer-mod-paladin, name: Paladín del Horror, effect: Modificación 6 en 2D6; cuesta 20 coronas y concede +1 Liderazgo a la Abominación., source: {manual: khemri, printed_page: 56, section: Tabla de Modificaciones Nigrománticas}}
  - {id: necromancer-mod-reflexes, name: Reflejos Aumentados, effect: Modificación 7 en 2D6; cuesta 15 coronas y concede +1 Iniciativa a la Abominación., source: {manual: khemri, printed_page: 56, section: Tabla de Modificaciones Nigrománticas}}
  - {id: necromancer-mod-limbs, name: Múltiples Extremidades, effect: Modificación 8 en 2D6; cuesta 30 coronas y concede +1 Ataque a la Abominación., source: {manual: khemri, printed_page: 56, section: Tabla de Modificaciones Nigrománticas}}
  - {id: necromancer-mod-ram-legs, name: Patas de Carnero, effect: Modificación 9 en 2D6; cuesta 35 coronas y concede +3 cm de Movimiento a la Abominación., source: {manual: khemri, printed_page: 56, section: Tabla de Modificaciones Nigrománticas}}
  - {id: necromancer-mod-wings, name: Alas, effect: Modificación 10 en 2D6; cuesta 30 coronas y permite saltar desde alturas de hasta 10 cm sin chequeo de Iniciativa; no permite volar., source: {manual: khemri, printed_page: 56, section: Tabla de Modificaciones Nigrománticas}}
  - {id: necromancer-mod-anvil-head, name: Cabeza de Yunque, effect: Modificación 11 en 2D6; cuesta 45 coronas. Si cargó puede sustituir todos sus ataques por uno que, si impacta, causa 1D3 heridas resueltas por separado., source: {manual: khemri, printed_page: 56, section: Tabla de Modificaciones Nigrománticas}}
  - {id: necromancer-mod-stench, name: Hedor Putrefacto, effect: Modificación 12 en 2D6; cuesta 35 coronas. Las criaturas vivas que luchen contra la Abominación sufren -1 para impactar en cuerpo a cuerpo., source: {manual: khemri, printed_page: 56, section: Tabla de Modificaciones Nigrománticas}}
