band_rules:
  - {id: nomad-hate-undead, name: Odio a los No Muertos, effect: Toda la banda odia a los No Muertos., source: {manual: khemri, printed_page: 48, section: Reglas especiales de los Nómadas}}
  - {id: nomad-skill-sand-worm, name: Gusano de Arena, effect: En terreno abierto desértico se considera oculto aunque no haya escenografía; no funciona dentro de edificios., source: {manual: khemri, printed_page: 49, section: Habilidades Especiales de los Nómadas}}
  - {id: nomad-skill-run-and-shoot, name: Correr y Disparar, effect: Puede correr y disparar con -2 para impactar en vez del -1 por mover., source: {manual: khemri, printed_page: 49, section: Habilidades Especiales de los Nómadas}}
  - {id: nomad-skill-climate-adapted, name: Adaptado al Clima, effect: Puede ignorar los resultados de calor y calor infernal de la tabla climatológica., source: {manual: khemri, printed_page: 49, section: Habilidades Especiales de los Nómadas}}
  - {id: nomad-skill-contacts, name: Contactos, effect: Suma +1 a la tirada para encontrar objetos raros., source: {manual: khemri, printed_page: 49, section: Habilidades Especiales de los Nómadas}}
