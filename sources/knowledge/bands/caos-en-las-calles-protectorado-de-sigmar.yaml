    name: Sacerdote Guerrero
    type: hero
    cost: 80
    experience: 20
    characteristics: {M: 10, WS: 4, BS: 3, S: 4, T: 3, W: 1, I: 4, A: 1, Ld: 8}
    equipment_lists: [protectorate-devout-equipment]
    fixed_equipment: []
    equipment_restrictions: [Puede llevar armadura y continuar utilizando Plegarias de Sigmar]
    skill_access: [combat, academic, strength, speed, protectorate_special]
    rules:
      - {id: warrior-priest-leader, name: Jefe, effect: Cualquier miembro de la banda situado a 15 cm o menos puede utilizar su Liderazgo para sus chequeos., source: {manual: caos-en-las-calles, printed_page: 153, section: Sacerdote Guerrero}}
      - {id: sigmar-prayers-access, name: Plegarias, effect: Tiene acceso a las Plegarias de Sigmar; la lista y sus efectos mágicos quedan fuera del alcance actual de la base canónica., source: {manual: caos-en-las-calles, printed_page: 153, section: Sacerdote Guerrero}}
