band_rules:
  - id: hatred-dark-elves
    name: Odio hacia los Elfos Oscuros
    effect: Todos los miembros de la banda, excepto los espadas de alquiler, odian a los Elfos Oscuros.
    source: {manual: caos-en-las-calles, printed_page: 137, section: Reglas Especiales de los Hijos de Nagarythe}
  - id: excellent-vision
    name: Visión Excelente
    effect: Pueden detectar enemigos escondidos al doble de la distancia habitual.
    source: {manual: caos-en-las-calles, printed_page: 137, section: Reglas Especiales de los Hijos de Nagarythe}
  - id: honourable
    name: Honorables
    effect: Ningún miembro de la banda puede utilizar venenos ni drogas de ningún tipo.
    source: {manual: caos-en-las-calles, printed_page: 137, section: Reglas Especiales de los Hijos de Nagarythe}
  - id: unforgiving
    name: No perdonan
    effect: En partidas multijugador nunca puede aliarse con bandas caóticas, incluidos Poseídos, Skaven, Hombres Bestia y Elfos Oscuros.
    source: {manual: caos-en-las-calles, printed_page: 137, section: Reglas Especiales de los Hijos de Nagarythe}
  - id: tolerant
    name: Tolerantes
    effect: Puede contratar espadas de alquiler que no sean caóticos o diabólicos, excluidos Skaven, Poseídos, Hombres Bestia, Elfos Oscuros y No Muertos. Rehúye a especialistas en venenos y no puede contratar asesinos.
    source: {manual: caos-en-las-calles, printed_page: 137, section: Reglas Especiales de los Hijos de Nagarythe}
  - id: elf-wine
    name: Vino Élfico
    effect: Cuesta 50 más 3D6 coronas, es Raro 10 y exclusivo de la banda. Antes de una batalla hace que toda la banda sea inmune al miedo durante esa batalla; es de un solo uso.
    source: {manual: caos-en-las-calles, printed_page: 138, section: Vino Élfico}
  - id: elf-runestones
    name: Piedras Rúnicas Élficas
    effect: Cuestan 50 más 2D6 coronas, son Raras 11 y solo puede llevarlas el Tejedor. Puede intentar dispersar un hechizo lanzado con éxito sobre él o un aliado a 45 cm; debe superar la tirada de lanzamiento enemiga sin ayuda de Hechicería.
    source: {manual: caos-en-las-calles, printed_page: 138, section: Piedras Rúnicas Élficas}
  - id: nagarythe-standard
    name: Estandarte de Nagarythe
    effect: Cuesta 75 más 3D6 coronas, es Raro 9 y exclusivo de la banda. Actúa como segundo punto de reagrupamiento; los miembros a 15 cm superan automáticamente los chequeos de Liderazgo contra Liderazgo 10. Si el portador queda fuera de combate, la banda entra en Furia Asesina y no puede retirarse voluntariamente. Requiere una mano libre, impide usar arma o escudo en ella y puede emplearse como lanza con menos uno para impactar.
    source: {manual: caos-en-las-calles, printed_page: 138, section: Estandarte de Nagarythe}
  - id: nagarythe-war-horn
    name: Cuerno de Guerra de Nagarythe
    effect: Cuesta 25 más 1D6 coronas, es Raro 6 y exclusivo de la banda. Una vez por batalla, al inicio de un turno propio, concede más uno al Liderazgo de toda la banda hasta un máximo de 10 y hasta el siguiente turno; puede sonar justo antes de un chequeo de retirada.
    source: {manual: caos-en-las-calles, printed_page: 139, section: Cuerno de Guerra de Nagarythe}
  - id: see-in-shadows
    name: Ver en las Sombras
    effect: Puede repetir una tirada para cargar contra un oponente que no ve si dispone de movimiento suficiente para alcanzarlo.
    source: {manual: caos-en-las-calles, printed_page: 142, section: Habilidades Especiales de los Hijos de Nagarythe}
  - id: master-of-runes
    name: Maestro de las Runas
    effect: Solo el Maestro del Conocimiento puede escogerla. Obtiene más uno al dispersar con Piedras Rúnicas Élficas. Antes de cada batalla puede inscribir una runa en el arma o armadura de un miembro; una vez en esa batalla puede repetir una salvación por armadura o una parada fallida, según el componente. La runa desaparece después.
    source: {manual: caos-en-las-calles, printed_page: 142, section: Habilidades Especiales de los Hijos de Nagarythe}
  - id: elf-agility
    name: Agilidad Élfica
    effect: Evita ataques cuerpo a cuerpo y de proyectiles con 6+. Si además posee Echarse a un Lado o Esquivar, la salvación correspondiente mejora a 4+; por ejemplo, cuerpo a cuerpo con 4+ y proyectiles con 6 si solo posee Echarse a un Lado.
    source: {manual: caos-en-las-calles, printed_page: 142, section: Habilidades Especiales de los Hijos de Nagarythe}
  - id: strong-build
    name: Constitución Fuerte
    effect: Puede escoger habilidades de Fuerza. El Tejedor de Sombras no puede obtenerla y como máximo dos miembros de la banda pueden poseerla simultáneamente.
    source: {manual: caos-en-las-calles, printed_page: 142, section: Habilidades Especiales de los Hijos de Nagarythe}
  - id: infiltration
    name: Infiltración
    effect: Despliega después del enemigo en cualquier lugar fuera de su línea de visión y a más de 30 cm de cualquier miniatura enemiga. Si ambos bandos infiltran, cada miniatura tira 1D6 y despliega primero quien obtenga menos.
    source: {manual: caos-en-las-calles, printed_page: 142, section: Habilidades Especiales de los Hijos de Nagarythe}
  - id: hidden-marksman
    name: Tirador Apostado
    effect: Si está escondido puede disparar o lanzar hechizos y permanecer escondido.
    source: {manual: caos-en-las-calles, printed_page: 142, section: Habilidades Especiales de los Hijos de Nagarythe}
  - id: hide-in-shadows
    name: Ocultarse en las Sombras
    effect: Los enemigos reducen a la mitad su Iniciativa antes de medir la distancia para detectar al Sombrío oculto.
    source: {manual: caos-en-las-calles, printed_page: 142, section: Habilidades Especiales de los Hijos de Nagarythe}
