band_rules:
  - {id: black-hunger, name: Hambre Negra, effect: Al inicio del turno el Héroe puede ganar +1 Ataque y +1D6+2 cm de movimiento ese turno; después recibe 1D3 impactos F3 sin salvación., source: {manual: trollheim, printed_page: 93, section: Habilidades Especiales Skavens}}
  - {id: tail-fighting, name: Combate con la Cola, effect: Puede llevar cuchillo, escudo o espada con la cola; obtiene un ataque adicional con el arma o +1 a salvación con el escudo., source: {manual: trollheim, printed_page: 93, section: Habilidades Especiales Skavens}}
  - {id: master-climber, name: Trepador Nato, effect: No realiza chequeos de Iniciativa al trepar por superficies verticales., source: {manual: trollheim, printed_page: 93, section: Habilidades Especiales Skavens}}
  - {id: infiltration, name: Infiltración, effect: Se despliega después del rival fuera de su línea de visión y a más de 30 cm; si ambos infiltran se decide el orden con 1D6 por miniatura., source: {manual: trollheim, printed_page: 93, section: Habilidades Especiales Skavens}}
  - {id: unarmed-art, name: Arte del Combate sin Armas, effect: Se considera equipado con dos armas usando sus garras; obtiene +1 Ataque y causa crítico con 5-6. Con Garras de Combate obtiene +2 Ataques., source: {manual: trollheim, printed_page: 93, section: Habilidades Especiales Skavens}}
  - {id: blowpipe-rules, name: Cerbatana, effect: Alcance 20 cm, F1, salvación +1; Veneno similar al Loto Negro y Silenciosa., source: {manual: trollheim, printed_page: 92, section: Equipo Especial Skaven}}
  - {id: warp-pistol-rules, name: Pistola Bruja, effect: Alcance 20 cm, F5, salvación -3; dispara una vez cada dos turnos., source: {manual: trollheim, printed_page: 92, section: Equipo Especial Skaven}}
  - {id: fighting-claws-rules, name: Garras de Combate, effect: Par de armas; +1 Ataque, +1 I al trepar, permite repetir una parada fallida y no admite otras armas durante la batalla., source: {manual: trollheim, printed_page: 92, section: Equipo Especial Skaven}}
  - {id: weeping-blades-rules, name: Espadas Supurantes, effect: Par de armas; +1 Ataque, Loto Negro permanente y Parada; no admite otro veneno., source: {manual: trollheim, printed_page: 92, section: Equipo Especial Skaven}}
