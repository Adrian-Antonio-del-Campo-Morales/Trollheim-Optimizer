profiles:
  - id: dwarf-noble
    name: Noble Enano
    type: hero
    cost: 85
    experience: 20
    characteristics: {M: 8, WS: 5, BS: 4, S: 3, T: 4, W: 1, I: 2, A: 1, Ld: 9}
    equipment_lists: [dwarf-warrior-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: [combat, shooting, strength, dwarf_special]
    rules:
      - id: dwarf-noble-leader
        name: Jefe
        effect: Cualquier miembro de la banda situado a 15 cm o menos puede utilizar el Liderazgo del Noble para sus chequeos de Liderazgo.
        source: {manual: caos-en-las-calles, printed_page: 114, section: Noble Enano}
    source: {manual: caos-en-las-calles, printed_page: 114, section: Noble Enano}
  - id: dwarf-engineer
    name: Ingeniero Enano
    type: hero
    cost: 50
    experience: 10
    characteristics: {M: 8, WS: 4, BS: 3, S: 3, T: 4, W: 1, I: 2, A: 1, Ld: 9}
    equipment_lists: [dwarf-thunderer-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: [combat, shooting, dwarf_special]
    rules:
      - id: expert-armourer
        name: Armero Experto
        effect: Mientras permanezca en la banda, todas sus armas de proyectiles aumentan su alcance en 15 cm; las modificaciones necesitan su mantenimiento constante.
        source: {manual: caos-en-las-calles, printed_page: 114, section: Ingeniero Enano}
