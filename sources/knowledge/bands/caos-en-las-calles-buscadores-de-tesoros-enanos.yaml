    type: hero
    cost: 50
    experience: 8
    characteristics: {M: 8, WS: 4, BS: 3, S: 3, T: 4, W: 1, I: 2, A: 1, Ld: 9}
    equipment_lists: [dwarf-warrior-equipment]
    fixed_equipment: []
    equipment_restrictions: [No puede utilizar armas de proyectiles ni armaduras]
    skill_access: [combat, strength, dwarf_special, troll_slayer_special]
