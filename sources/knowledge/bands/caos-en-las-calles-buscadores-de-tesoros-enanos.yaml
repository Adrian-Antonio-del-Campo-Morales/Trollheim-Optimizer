band_rules:
  - id: dwarf-hard-to-kill
    name: Difícil de Matar
    effect: En la Tabla de Heridas, 1-2 significa derribado, 3-5 aturdido y únicamente un 6 deja al Enano fuera de combate.
    source: {manual: caos-en-las-calles, printed_page: 111, section: Reglas Especiales de los Buscadores de Tesoros}
  - id: dwarf-hard-head
    name: Cabeza Dura
    effect: Los Enanos ignoran las reglas especiales de mazas, garrotes y armas equivalentes.
    source: {manual: caos-en-las-calles, printed_page: 111, section: Reglas Especiales de los Buscadores de Tesoros}
  - id: dwarf-armour
    name: Armadura
    effect: Los Enanos no sufren penalización al movimiento por llevar armadura.
    source: {manual: caos-en-las-calles, printed_page: 111, section: Reglas Especiales de los Buscadores de Tesoros}
  - id: dwarf-hatred-orcs-goblins
    name: Odio hacia Orcos y Goblins
    effect: Todos los Enanos odian a los Orcos y Goblins y aplican las reglas de odio de la sección de psicología.
    source: {manual: caos-en-las-calles, printed_page: 111, section: Reglas Especiales de los Buscadores de Tesoros}
  - id: ancestral-grudge
    name: Agravio Ancestral
    effect: La banda nunca puede reclutar un espada de alquiler de raza élfica.
    source: {manual: caos-en-las-calles, printed_page: 111, section: Reglas Especiales de los Buscadores de Tesoros}
  - id: excellent-miners
    name: Mineros Excelentes
    effect: Suma uno al número de fragmentos de piedra bruja encontrados al resolver la exploración.
    source: {manual: caos-en-las-calles, printed_page: 111, section: Reglas Especiales de los Buscadores de Tesoros}
  - id: unbeatable-warrior
    name: Guerrero Imbatible
    effect: Al parar, igualar o superar la mayor tirada para impactar enemiga tiene éxito. Con dos armas con Parada puede efectuar dos paradas contra los dos resultados de ataque más altos. Con dos Hachas Enanas también puede repetir las paradas fallidas.
    source: {manual: caos-en-las-calles, printed_page: 113, section: Habilidades Especiales de los Buscadores de Tesoros}
  - id: very-resilient
    name: Muy Resistente
    effect: Puede repetir su tirada en la Tabla de Heridas Graves de Héroes después de quedar fuera de combate, pero debe aceptar el segundo resultado aunque sea peor.
    source: {manual: caos-en-las-calles, printed_page: 113, section: Habilidades Especiales de los Buscadores de Tesoros}
  - id: expert-searcher
    name: Buscador Experto
    effect: Puede modificar en más uno o menos uno uno de los dados de exploración después de una partida.
    source: {manual: caos-en-las-calles, printed_page: 113, section: Habilidades Especiales de los Buscadores de Tesoros}
  - id: tough-as-steel
    name: Duro como el Acero
    effect: Para este héroe, la Tabla de Heridas pasa a ser 1-3 derribado, 4-5 aturdido y 6 fuera de combate.
    source: {manual: caos-en-las-calles, printed_page: 113, section: Habilidades Especiales de los Buscadores de Tesoros}
  - id: stone-skull
    name: Cráneo de Piedra
    effect: Cuando queda aturdido, con 3+ queda derribado en su lugar. Si lleva Casco, la salvación es de 2+ y sustituye a la regla propia del Casco.
    source: {manual: caos-en-las-calles, printed_page: 113, section: Habilidades Especiales de los Buscadores de Tesoros}
  - id: monster-slayer
    name: Matador de Monstruos
    effect: El Matatrolls hiere siempre con 4+ sin importar la Resistencia, salvo si su Fuerza modificada permite herir con un resultado inferior.
    source: {manual: caos-en-las-calles, printed_page: 113, section: Habilidades Especiales del Matatrolls}
  - id: ferocious-charge
    name: Carga Feroz
    effect: El Matatrolls puede doblar sus ataques al cargar, pero sufre un modificador de menos uno para impactar ese turno.
    source: {manual: caos-en-las-calles, printed_page: 113, section: Habilidades Especiales del Matatrolls}
  - id: crazed-slayer
    name: Enloquecido
    effect: El Matatrolls suma uno a sus tiradas para impactar durante el turno en que carga.
    source: {manual: caos-en-las-calles, printed_page: 113, section: Habilidades Especiales del Matatrolls}
