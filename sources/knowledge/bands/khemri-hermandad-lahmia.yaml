profiles:
  - id: lahmia-vampire
    name: Vampira del Clan Lahmia
    type: hero
    cost: 110
    experience: 20
    characteristics: {M: 15, WS: 4, BS: 4, S: 4, T: 4, W: 2, I: 5, A: 2, Ld: 8}
    equipment_lists: [lahmia-foreign-undead-equipment, lahmia-native-undead-equipment]
    fixed_equipment: []
    equipment_restrictions: [Usa exclusivamente la lista extranjera o nativa elegida al crear la banda]
    skill_access: [combat, academic, strength, speed, special]
    rules:
      - {id: lahmia-leader, name: Jefe, effect: Cualquier miembro de la banda a 15 cm o menos puede utilizar su Liderazgo., source: {manual: khemri, printed_page: 86, section: Vampira del Clan Lahmia}}
      - {id: lahmia-vampire-undead, name: No Muerto, effect: Sigue todas las reglas de los No Muertos, salvo las excepciones expresas para Vampiras., source: {manual: khemri, printed_page: 86, section: Vampira del Clan Lahmia}}
      - {id: lahmia-local-knowledge, name: Conocimientos Locales, effect: Solo bandas nativas en campaña de Khemri. Si la Vampira no quedó fuera de combate, puede repetir uno de los dados de exploración y conservar el segundo resultado., source: {manual: khemri, printed_page: 86, section: Vampira del Clan Lahmia}}
    source: {manual: khemri, printed_page: 86, section: Vampira del Clan Lahmia}
