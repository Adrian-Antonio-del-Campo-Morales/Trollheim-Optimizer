band_rules:
  - {id: lahmia-backgrounds, name: Extranjeras o Nativas, effect: Al crear la banda elige un trasfondo. Determina listas de equipo y secuaces; no puede cambiarse. Tras la primera batalla en Khemri una extranjera pasa a usar reclutamiento y comercio nativos; fuera de Khemri solo puede usar los extranjeros., source: {manual: khemri, printed_page: 83, section: Elección de Guerreros}}
  - {id: lahmia-undead-fear, name: Causan Miedo, effect: Los No Muertos causan miedo., source: {manual: khemri, printed_page: 85, section: Reglas especiales de los No Muertos}}
  - {id: lahmia-undead-psychology, name: Inmune a Psicología, effect: No se ven afectados por psicología y nunca abandonan un combate., source: {manual: khemri, printed_page: 85, section: Reglas especiales de los No Muertos}}
  - {id: lahmia-undead-pain, name: Insensible al Dolor, effect: Consideran Aturdido como Derribado en la tabla de heridas., source: {manual: khemri, printed_page: 85, section: Reglas especiales de los No Muertos}}
  - {id: lahmia-undead-no-run, name: No Pueden Correr, effect: No pueden correr, aunque sí cargar normalmente; las Vampiras pueden correr., source: {manual: khemri, printed_page: 85, section: Reglas especiales de los No Muertos}}
  - {id: lahmia-undead-poison, name: Inmune a Venenos, effect: Los venenos no les afectan., source: {manual: khemri, printed_page: 85, section: Reglas especiales de los No Muertos}}
  - {id: lahmia-undead-brainless, name: Sin Cerebro, effect: No ganan experiencia; las Vampiras sí la ganan., source: {manual: khemri, printed_page: 85, section: Reglas especiales de los No Muertos}}
  - {id: lahmia-undead-no-drink, name: No Beben, effect: No necesitan alimento ni agua; los animales vivos que acompañan a las Vampiras siguen las reglas normales de agua., source: {manual: khemri, printed_page: 85, section: Reglas especiales de los No Muertos}}
  - {id: lahmia-vampire-death, name: Muerte de la Vampira, effect: Si muere tras la batalla no puede contratarse otra hasta que la Hermana de Sangre se transforme; mientras tanto manda el Héroe con más Liderazgo. Si no hay Hermana puede contratarse otra Vampira. Si mueren Vampira y Nigromante y no hay Hermana transformada, todos los secuaces No Muertos son destruidos., source: {manual: khemri, printed_page: 85, section: Reglas especiales de los No Muertos}}
  - {id: snake-whip-rule, name: Látigo Ofidio, effect: Raro 8, coste 25, Fuerza del usuario, solo Vampiras y Hermanas de Sangre. No puede pararse. Al cargar concede +1A; si es cargada concede +1A que solo ataca primero al enemigo que cargó. Con dos látigos cada uno concede +1A pero solo el primero conserva Restallido. Siempre está cubierto de Loto Negro y no admite otros venenos., source: {manual: khemri, printed_page: 85, section: Látigo Ofidio}}
  - {id: lahmia-skill-celerity, name: Celeridad, effect: Puede correr su Movimiento máximo pero a efectos de juego cuenta como si solo hubiese movido; puede correr y disparar, ocultarse u otras acciones normalmente prohibidas tras correr., source: {manual: khemri, printed_page: 90, section: Habilidades Especiales de las Vampiras Lahmia}}
  - {id: lahmia-skill-hypnotize, name: Hipnotizar, effect: Al inicio del combate elige un enemigo en contacto; este supera Liderazgo o no ataca ese turno y todos los ataques contra él obtienen +1 para impactar. No afecta a inmunes a psicología., source: {manual: khemri, printed_page: 90, section: Habilidades Especiales de las Vampiras Lahmia}}
  - {id: lahmia-skill-vampire-reflexes, name: Reflejos de Vampiro, effect: Salvación inmodificable de 6+ contra cualquier herida, tirada antes de multiplicar heridas. Puede combinarse con dos espadas para mejorar a 4+., source: {manual: khemri, printed_page: 90, section: Habilidades Especiales de las Vampiras Lahmia}}
  - {id: lahmia-skill-lost-innocence, name: Inocencia Perdida, effect: Gana Atacar Primero en cuerpo a cuerpo; si otra miniatura tiene una habilidad similar se resuelve por Iniciativa y los empates con 1D6., source: {manual: khemri, printed_page: 90, section: Habilidades Especiales de las Vampiras Lahmia}}
  - {id: lahmia-skill-seduction, name: Seducción, effect: Al inicio del combate tira Liderazgo; si supera, un enemigo en contacto supera Liderazgo o queda controlado por la Vampira. Puede recuperarse en su fase de recuperación. Solo controla uno; si ella ataca al seducido pierde el control, y si termina la batalla controlado se considera fuera de combate. Inmunes a psicología no se ven afectados., source: {manual: khemri, printed_page: 90, section: Habilidades Especiales de las Vampiras Lahmia}}
  - {id: lahmia-skill-night-creature, name: Criatura de la Noche, effect: Si no se movió en su fase de Movimiento, cualquier carga, disparo o hechizo contra ella necesita 4+ en 1D6 para poder realizarse., source: {manual: khemri, printed_page: 90, section: Habilidades Especiales de las Vampiras Lahmia}}
