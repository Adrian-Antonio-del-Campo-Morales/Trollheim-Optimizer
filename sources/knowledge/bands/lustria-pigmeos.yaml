      - {id: immune-psychology, name: Inmune a psicología, effect: Es inmune a psicología., source: {manual: lustria, printed_page: 124, section: Lunáticos Salvajes}}
      - {id: pygmy-lunatic, name: Lunáticos, effect: Al inicio de cada turno tira 1D6; con 1-3 obtiene furia asesina y con 4-6 estupidez., source: {manual: lustria, printed_page: 124, section: Lunáticos Salvajes}}
    source: {manual: lustria, printed_page: 124, section: Lunáticos Salvajes, note: El texto dice por error que se tire por cada caníbal; la regla pertenece al perfil Lunático Salvaje}
band_rules:
  - {id: pygmy-jungle-native, name: Nativos de la Jungla, effect: No sufren penalizadores por moverse por bosques o vegetación., source: {manual: lustria, printed_page: 121, section: Reglas Especiales de los Pigmeos}}
  - {id: pygmy-poison-experts, name: Expertos Envenenadores, effect: Tratan todos los venenos como comunes en comercio., source: {manual: lustria, printed_page: 121, section: Reglas Especiales de los Pigmeos}}
  - {id: pygmy-camouflage, name: Camuflaje, effect: Un Pigmeo sin armadura, salvo cuero endurecido, no puede ser detectado hasta que el atacante supere Iniciativa., source: {manual: lustria, printed_page: 121, section: Reglas Especiales de los Pigmeos}}
  - {id: pygmy-poisoned-darts, name: Dardos Envenenados, effect: Cuestan 30 coronas y tienen rareza 8. Arma arrojadiza de 15 cm y Fuerza del usuario, sin penalización por alcance o movimiento y no utilizable en cuerpo a cuerpo. Una herida no salvada exige Resistencia o paraliza; el paralizado no mueve ni lucha y recibe impactos automáticos en cuerpo a cuerpo hasta superar Resistencia en recuperación. Puede disparar oculto; el blanco tira Iniciativa para revelarlo., source: {manual: lustria, printed_page: 122, section: Dardos Envenenados}}
  - {id: shrunken-head, name: Cabeza Reducida, effect: Cuesta 25 coronas y tiene rareza 6. Arma arrojadiza de 15 cm y Fuerza 2 sin penalización por alcance o movimiento; no se usa en cuerpo a cuerpo. El impactado hace inmediatamente Pánico, salvo inmunes a psicología, Grandes o Bestias Enormes., source: {manual: lustria, printed_page: 122, section: Cabeza Reducida}}
