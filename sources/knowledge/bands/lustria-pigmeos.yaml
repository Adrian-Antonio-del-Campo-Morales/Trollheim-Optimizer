      - {id: immune-poison, name: Inmune a venenos, effect: Es inmune a venenos., source: {manual: lustria, printed_page: 124, section: Caníbales}}
    source: {manual: lustria, printed_page: 120-124, section: Caníbales / Cazador de Cabezas, note: La composición y el perfil usan Caníbal; experiencia y habilidades usan Cazador de Cabezas. No aparece un sexto perfil, por lo que se representan como el mismo guerrero}
