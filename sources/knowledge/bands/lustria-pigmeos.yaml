  - id: pygmy-silent-walker
    name: Caminante Silencioso
    type: hero
    cost: 35
    experience: 10
    characteristics: {M: 10, WS: 3, BS: 2, S: 2, T: 2, W: 1, I: 3, A: 1, Ld: 7}
    equipment_lists: [pygmy-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: [shooting, academic, speed]
    rules:
      - {id: pygmy-spirit-form, name: Forma Espiritual, effect: Puede atravesar paredes y obstáculos, pero no cargar contra objetivos fuera de su línea de visión. No sufre daño por caídas., source: {manual: lustria, printed_page: 123, section: Caminante Silencioso}}
      - {id: pygmy-ethereal, name: Etéreo, effect: Tiene salvación especial de 5+ contra ataques mundanos, anulada por ataques mágicos., source: {manual: lustria, printed_page: 123, section: Caminante Silencioso}}
      - {id: immune-psychology, name: Inmune a psicología, effect: Es inmune a psicología., source: {manual: lustria, printed_page: 123, section: Caminante Silencioso}}
      - {id: causes-fear, name: Causa miedo, effect: Causa miedo., source: {manual: lustria, printed_page: 123, section: Caminante Silencioso}}
    source: {manual: lustria, printed_page: 123, section: Caminante Silencioso}
