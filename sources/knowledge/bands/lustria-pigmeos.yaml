    type: henchman
    cost: 20
    experience: 0
    characteristics: {M: 10, WS: 3, BS: 3, S: 2, T: 2, W: 1, I: 3, A: 1, Ld: 7}
    equipment_lists: [pygmy-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: []
