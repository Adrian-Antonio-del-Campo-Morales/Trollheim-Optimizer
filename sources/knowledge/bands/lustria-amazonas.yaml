      - {id: amazon-cat-companion, name: Compañero animal, effect: Debe desplegar junto a su Exploradora. Si esta queda fuera de combate entra en furia asesina hasta el final de la batalla; si muere o es despedida, el felino abandona la banda., source: {manual: lustria, printed_page: 71, section: Grandes Felinos}}
    source: {manual: lustria, printed_page: 71, section: Grandes Felinos}
band_rules:
  - {id: amazon-sacrifice, name: Sacrificio, effect: Todo cautivo encontrado o capturado tras una batalla debe sacrificarse y la Sacerdotisa gana +1 experiencia., source: {manual: lustria, printed_page: 67, section: Reglas Especiales de las Amazonas}}
  - {id: amazon-no-outsiders, name: No es una de las nuestras, effect: No puede aliarse con otras bandas ni contratar espadas de alquiler o personajes que no sean Amazonas., source: {manual: lustria, printed_page: 67, section: Reglas Especiales de las Amazonas}}
  - {id: amazon-isolationists, name: Aislacionistas, effect: Todas las Amazonas odian a Norses y Hombres Lagarto., source: {manual: lustria, printed_page: 67, section: Reglas Especiales de las Amazonas}}
  - {id: amazon-norse-enmity, name: Enemistad Nórdica, effect: Contra Norses pueden repetir el primer chequeo de retirada fallido y no pueden retirarse voluntariamente., source: {manual: lustria, printed_page: 67, section: Reglas Especiales de las Amazonas}}
  - {id: ancestral-claw, name: Garra de los Ancestrales, effect: Cuesta 30 coronas y tiene rareza 10. En cuerpo a cuerpo usa Fuerza del usuario +1 y las heridas no permiten salvación por armadura., source: {manual: lustria, printed_page: 69, section: Garra de los Ancestrales}}
  - {id: solar-staff, name: Báculo solar, effect: Cuesta 50 coronas y tiene rareza 12. Alcance 60 cm, Fuerza 4, sin penalización por larga distancia y sin salvación por armadura., source: {manual: lustria, printed_page: 69, section: Báculo solar}}
  - {id: solar-gauntlet, name: Guantelete solar, effect: Cuesta 40 coronas y tiene rareza 11. Alcance 30 cm, Fuerza 4, sin penalización por larga distancia ni salvación por armadura. En cuerpo a cuerpo puede combinarse con otra arma, usa Fuerza 4, no permite salvación y no necesita recarga., source: {manual: lustria, printed_page: 69, section: Guantelete solar}}
  - {id: moon-amulet, name: Amuleto de la Luna, effect: Cuesta 50 coronas y tiene rareza 11. Los proyectiles dirigidos contra la portadora sufren -1 para impactar y esta obtiene una salvación especial de 5+ contra proyectiles., source: {manual: lustria, printed_page: 69, section: Amuleto de la Luna}}
  - {id: amazon-skill-lizard-hunter, name: Cazadora de Lagartos, effect: Ataca siempre primero en cuerpo a cuerpo contra cualquier Eslizón, sin importar el arma ni quién cargó., source: {manual: lustria, printed_page: 72, section: Habilidades Especiales de las Amazonas}}
  - {id: amazon-skill-concealment, name: Ocultación, effect: Al esconderse en terreno selvático o vegetación los enemigos reducen a la mitad su Iniciativa para detectarla., source: {manual: lustria, printed_page: 72, section: Habilidades Especiales de las Amazonas}}
  - {id: amazon-skill-hypnotic-dance, name: Danza Hipnotizadora, effect: Un enemigo que quiera atacarla debe superar Liderazgo al comienzo de la fase de combate; si falla no ataca, aunque se defiende normalmente. No afecta a No Muertos ni Hombres Lagarto., source: {manual: lustria, printed_page: 72, section: Habilidades Especiales de las Amazonas}}
  - {id: amazon-skill-animal-fury, name: Furia Animal, effect: Es inmune a miedo y a solo ante el peligro, y obtiene +1 Ataque cuando carga., source: {manual: lustria, printed_page: 72, section: Habilidades Especiales de las Amazonas}}
  - {id: amazon-skill-elixir-of-life, name: Elixir de la Vida, effect: Puede repetir su tirada de heridas después de la batalla y debe aceptar el segundo resultado aunque sea peor., source: {manual: lustria, printed_page: 72, section: Habilidades Especiales de las Amazonas}}
