    equipment_restrictions: [No puede utilizar equipo, Solo uno por Exploradora]
    skill_access: []
    rules:
      - {id: animal, name: Animal, effect: No gana experiencia., source: {manual: lustria, printed_page: 71, section: Grandes Felinos}}
