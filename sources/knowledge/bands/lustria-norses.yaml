band_rules:
  - {id: norse-seamen, name: Marineros, effect: Todo Norse obtiene +2 Fuerza para remar., source: {manual: lustria, printed_page: 107, section: Reglas Especiales de los Norses}}
  - {id: norse-skill-shield-mastery, name: Maestría con el Escudo, effect: Puede parar con escudo como si fuera rodela y conserva el bonificador de salvación del escudo., source: {manual: lustria, printed_page: 111, section: Habilidades Especiales de los Norses}}
  - {id: norse-skill-northern-weapons, name: Armas del Norte, effect: Cuando ataca con hacha o arma a dos manos puede repetir una vez cada ataque fallido., source: {manual: lustria, printed_page: 111, section: Habilidades Especiales de los Norses}}
  - {id: norse-skill-battle-tongue, name: Lengua de Batalla, effect: Solo el Jefe actual. Aumenta el radio de Jefe a 30 cm., source: {manual: lustria, printed_page: 111, section: Habilidades Especiales de los Norses}}
  - {id: norse-skill-barbarian-courage, name: Coraje Bárbaro, effect: Ignora los chequeos de Liderazgo por estar solo ante el peligro., source: {manual: lustria, printed_page: 111, section: Habilidades Especiales de los Norses}}
  - {id: norse-skill-demolishing-blow, name: Golpe Demoledor, effect: Los ataques del guerrero no pueden pararse., source: {manual: lustria, printed_page: 111, section: Habilidades Especiales de los Norses}}
  - {id: pirate-scourge, name: Azote, effect: Cuesta 8 coronas. Usa Fuerza del usuario, concede +1 a la salvación enemiga y no puede pararse. Al cargar da +1 Ataque; al ser cargado da +1 Ataque solo contra quien carga y ese ataque Ataca Primero. Dos azotes aportan +1 Ataque por arma adicional, pero Latigazo solo se aplica una vez., source: {manual: lustria, printed_page: 111, section: Equipo Especial de los Norses}}
