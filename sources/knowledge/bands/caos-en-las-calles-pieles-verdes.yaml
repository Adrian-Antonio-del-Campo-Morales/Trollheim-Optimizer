profiles:
  - id: orc-boss
    name: Jefe Orco
    type: hero
    cost: 80
    experience: 20
    characteristics: {M: 10, WS: 4, BS: 4, S: 4, T: 4, W: 1, I: 3, A: 1, Ld: 8}
    equipment_lists: [orc-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: [combat, shooting, strength, speed, greenskin_special]
    rules:
      - {id: orc-boss-leader, name: Jefe, effect: Cualquier miembro de la banda situado a 15 cm o menos puede utilizar su Liderazgo para sus chequeos., source: {manual: caos-en-las-calles, printed_page: 132, section: Jefe Orco}}
    source: {manual: caos-en-las-calles, printed_page: 132, section: Jefe Orco}
  - id: orc-shaman
    name: Chamán Orco
    type: hero
    cost: 40
    experience: 10
    characteristics: {M: 10, WS: 3, BS: 3, S: 3, T: 4, W: 1, I: 3, A: 1, Ld: 7}
    equipment_lists: [orc-equipment]
    fixed_equipment: []
    equipment_restrictions: [No puede equiparse con armadura]
    skill_access: [strength, greenskin_special]
    rules:
      - {id: waaagh-wizard, name: Hechicero, effect: Utiliza la magia ¡Waaagh! y genera sus hechizos en esa lista., source: {manual: caos-en-las-calles, printed_page: 132, section: Chamán Orco}}
    source: {manual: caos-en-las-calles, printed_page: 132, section: Chamán Orco}
  - id: orc-big-un
    name: Orco Grandote
    type: hero
    cost: 40
    experience: 15
    characteristics: {M: 10, WS: 4, BS: 3, S: 3, T: 4, W: 1, I: 3, A: 1, Ld: 7}
    equipment_lists: [orc-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: [combat, shooting, strength, greenskin_special]
    rules: []
    source: {manual: caos-en-las-calles, printed_page: 132, section: Orcos Grandotez}
  - id: orc-warrior
    name: Guerrero Orco
    type: henchman
    cost: 25
    experience: 0
    characteristics: {M: 10, WS: 3, BS: 3, S: 3, T: 4, W: 1, I: 2, A: 1, Ld: 7}
    equipment_lists: [orc-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: []
    rules:
      - {id: animosity, name: Animosidad, effect: Está sujeto a las reglas completas de Animosidad de la banda., source: {manual: caos-en-las-calles, printed_page: 133, section: Guerreroz Orcos}}
    source: {manual: caos-en-las-calles, printed_page: 133, section: Guerreroz Orcos}
  - id: goblin-warrior
    name: Guerrero Goblin
    type: henchman
    cost: 15
    experience: 0
    characteristics: {M: 10, WS: 2, BS: 3, S: 3, T: 3, W: 1, I: 3, A: 1, Ld: 5}
    equipment_lists: [goblin-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: []
    rules:
      - {id: goblin-animosity, name: Animosidad, effect: Está sujeto a Animosidad, pero un resultado de uno nunca le hace cargar contra un Secuaz Orco; sí puede dispararle si dispone de arma de proyectiles., source: {manual: caos-en-las-calles, printed_page: 133, section: Guerreroz Goblin}}
      - {id: not-orcs, name: No son Orcos, effect: Cada Goblin o Garrapato fuera de combate cuenta como media miniatura al calcular si la banda debe efectuar un chequeo de retirada., source: {manual: caos-en-las-calles, printed_page: 133, section: Guerreroz Goblin}}
      - {id: useless-runts, name: Tipejos inútiles, effect: Gana experiencia normalmente, pero si obtiene El chico tiene talento se elimina una miniatura del grupo en vez de ascenderla a héroe., source: {manual: caos-en-las-calles, printed_page: 133, section: Guerreroz Goblin}}
      - {id: fear-elves, name: Miedo a los Orejas Picudas, effect: Siente miedo hacia los Elfos., source: {manual: caos-en-las-calles, printed_page: 133, section: Guerreroz Goblin}}
    source: {manual: caos-en-las-calles, printed_page: 133, section: Guerreroz Goblin}
  - id: cave-squig
    name: Garrapato Cavernícola
    type: henchman
    cost: 15
    experience: 0
    characteristics: {M: 5D6, WS: 4, BS: 0, S: 4, T: 3, W: 1, I: 4, A: 1, Ld: 5}
    equipment_lists: []
    fixed_equipment: [Boca gigantesca]
    equipment_restrictions: [Nunca utiliza ni necesita armas o armaduras]
    skill_access: []
    rules:
      - {id: squig-movement, name: Movimiento, effect: Mueve 5D6 cm; nunca corre ni declara cargas. Si alcanza a un enemigo durante su movimiento normal se considera que ha cargado y ataca como tal en la siguiente fase cuerpo a cuerpo., source: {manual: caos-en-las-calles, printed_page: 134, section: Garrapatos Cavernícolas}}
      - {id: squig-keepers, name: Kuidadorez, effect: Debe permanecer a 15 cm o menos de un Guerrero Goblin. Si no lo está al inicio de su movimiento se descontrola y desde entonces mueve 5D6 cm en dirección aleatoria, atacando a cualquier miniatura que alcance, hasta el final de la partida., source: {manual: caos-en-las-calles, printed_page: 134, section: Garrapatos Cavernícolas}}
      - {id: not-orcs, name: No son Orcos, effect: Cuenta como media miniatura al calcular si la banda debe efectuar un chequeo de retirada., source: {manual: caos-en-las-calles, printed_page: 134, section: Garrapatos Cavernícolas}}
      - {id: animal, name: Animales, effect: No acumula experiencia., source: {manual: caos-en-las-calles, printed_page: 134, section: Garrapatos Cavernícolas}}
    source: {manual: caos-en-las-calles, printed_page: 134, section: Garrapatos Cavernícolas}
  - id: troll
    name: Troll
    type: henchman
    cost: 200
    experience: 0
    characteristics: {M: 15, WS: 3, BS: 1, S: 5, T: 4, W: 3, I: 1, A: 3, Ld: 4}
    equipment_lists: []
    fixed_equipment: [Garrote gigantesco opcional sin efecto de equipo]
    equipment_restrictions: [Nunca puede equiparse con armas o armaduras]
    skill_access: []
    rules:
      - {id: fear, name: Miedo, effect: Causa miedo., source: {manual: caos-en-las-calles, printed_page: 135, section: Troll}}
      - {id: stupidity, name: Estupidez, effect: Está sujeto a las reglas de estupidez., source: {manual: caos-en-las-calles, printed_page: 135, section: Troll}}
      - {id: regeneration, name: Regeneración, effect: Cada vez que sufre una herida la ignora con 4+. No puede regenerar heridas causadas por fuego o magia ígnea y no tira Heridas Graves después de la batalla., source: {manual: caos-en-las-calles, printed_page: 135, section: Troll}}
      - {id: stupid-monster, name: Monstruo estúpido, effect: No gana experiencia ni puede aprender habilidades., source: {manual: caos-en-las-calles, printed_page: 135, section: Troll}}
      - {id: always-hungry, name: Siempre hambrientos, effect: Después de cada batalla cuesta 15 coronas mantenerlo. En su lugar puede sacrificarse un Guerrero Goblin o Garrapato. Si no se paga de ningún modo, abandona la banda., source: {manual: caos-en-las-calles, printed_page: 135, section: Troll}}
      - {id: troll-vomit, name: Vómito, effect: En vez de atacar normalmente puede efectuar un único ataque cuerpo a cuerpo que impacta automáticamente con Fuerza 5 e ignora la armadura., source: {manual: caos-en-las-calles, printed_page: 135, section: Troll}}
      - {id: large-target, name: Objetivo Grande, effect: Puede ser escogido como blanco aunque no sea el objetivo más cercano y los disparos contra él reciben más uno para impactar., source: {manual: caos-en-las-calles, printed_page: 135, section: Troll}}
    source: {manual: caos-en-las-calles, printed_page: 135, section: Troll}
band_rules:
  - id: greenskin-roster-ratios
    name: Límites de Goblins y Garrapatos
    effect: No puede haber más de dos Guerreros Goblin por cada Orco de la banda, contando héroes Orcos. Tampoco puede haber más Garrapatos Cavernícolas que Guerreros Goblin, y en ningún caso más de cinco.
    source: {manual: caos-en-las-calles, printed_page: 126, section: Elección de Guerreros}
  - id: animosity
    name: Animosidad
    effect: Al inicio de cada turno tira 1D6 por cada Secuaz Orco o Goblin que no esté trabado. Con 2-6 actúa normalmente. Con 1 tira otra vez; con 1 carga y combate un Secuaz Orco o Goblin o espada de alquiler aliado cercano, o le dispara si no puede cargar, y no hace nada más; con 2 pasa el turno insultando al compañero más próximo salvo que sea atacado; con 3 mueve inmediatamente hacia el enemigo visible más próximo y carga si puede, pudiendo volver a mover o cargar en su fase normal.
    source: {manual: caos-en-las-calles, printed_page: 127, section: Reglas Especiales de los Pieles Verdes}
  - id: unpleasant-company
    name: Compañía Desagradable
    effect: Solo puede contratar Luchadores de Pozo y Hechiceros, además de espadas de alquiler Pieles Verdes, Ogros, hechiceros malvados o cualquier espada Caótica.
    source: {manual: caos-en-las-calles, printed_page: 127, section: Reglas Especiales de los Pieles Verdes}
  - id: ball-and-chain
    name: Bola con Kadena
    effect: Solo Goblins; Común. La ficha indica 15 coronas, pero la lista de banda indica 25. Fuerza del usuario más dos, sin salvación por armadura y cada impacto causa 1D3 heridas. Solo puede usarse bajo Hongos Pirakabezas y excluye cualquier otro equipo. El primer turno mueve 5D6 cm en la dirección elegida; después, 1 mata al portador, 2-5 permite elegir dirección y 6 da dirección aleatoria. Contactar con una miniatura cuenta como carga; los ataques contra el portador sufren menos uno para impactar, no puede quedar retenido y chocar con un obstáculo lo deja fuera de combate. Ignora Animosidad. Al acabar la batalla debe tirar en Heridas Graves aunque no quedase fuera de combate.
    source: {manual: caos-en-las-calles, printed_page: 128, section: Bola con Kadena}
  - id: squig-prodder
    name: Pinchagarrapatoz
    effect: Cuesta 15 coronas, es Común y solo para Goblins. Usa la Fuerza del usuario y Ataca Primero en la primera ronda cuerpo a cuerpo. Permite controlar Garrapatos hasta 30 cm. No puede combinarse con segunda arma o rodela, aunque sí con escudo.
    source: {manual: caos-en-las-calles, printed_page: 129, section: Pinchagarrapatoz}
  - id: mad-cap-mushrooms
    name: Hongos Pirakabezas
    effect: Cuestan 25 coronas y son Comunes si la banda incluye Goblins. Antes de la batalla conceden Furia Asesina y permiten usar una Bola con Kadena. No afectan a No Muertos ni Poseídos. Después de la batalla, con un 1 en 1D6 el consumidor queda permanentemente estúpido.
    source: {manual: caos-en-las-calles, printed_page: 129, section: Hongos Pirakabezas}
  - id: hard-head
    name: Kabezadura
    effect: Salvación especial de 3+ para convertir un resultado de aturdido en derribado; con Casco es de 2+ y sustituye su regla normal.
    source: {manual: caos-en-las-calles, printed_page: 130, section: Habilidades Especiales de los Pieles Verdes}
  - id: waaagh-charge
    name: ¡Waaagh!
    effect: Suma 1D6 más 2 cm a su movimiento de carga.
    source: {manual: caos-en-las-calles, printed_page: 130, section: Habilidades Especiales de los Pieles Verdes}
  - id: here-we-go
    name: ¡Allá vamoz!
    effect: Puede ignorar los chequeos de miedo y terror al cargar.
    source: {manual: caos-en-las-calles, printed_page: 130, section: Habilidades Especiales de los Pieles Verdes}
  - id: cunning-plan
    name: Un Plan Aztuto
    effect: Solo el Jefe puede escogerla. La banda puede repetir un chequeo de retirada fallido si el Jefe no está fuera de combate.
    source: {manual: caos-en-las-calles, printed_page: 130, section: Habilidades Especiales de los Pieles Verdes}
  - id: very-tough
    name: Muy Duro
    effect: Suma uno a sus tiradas de salvación por armadura.
    source: {manual: caos-en-las-calles, printed_page: 130, section: Habilidades Especiales de los Pieles Verdes}
  - id: head-basher
    name: Machacabezas
    effect: Cualquier resultado de derribado que cause cuerpo a cuerpo se convierte en aturdido.
    source: {manual: caos-en-las-calles, printed_page: 130, section: Habilidades Especiales de los Pieles Verdes}
