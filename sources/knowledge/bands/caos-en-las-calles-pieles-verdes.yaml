id: chaos-streets-greenskins
name: Pieles Verdes
source: {manual: caos-en-las-calles, printed_page: 126-135, section: Pieles Verdes}
roster:
  minimum_models: 3
  maximum_models: 20
  starting_gold: 500
  members:
    - {profile_id: orc-boss, minimum: 1, maximum: 1}
    - {profile_id: orc-shaman, minimum: 0, maximum: 1}
    - {profile_id: orc-big-un, minimum: 0, maximum: 2}
    - {profile_id: orc-warrior, minimum: 0, maximum: null}
    - {profile_id: goblin-warrior, minimum: 0, maximum: null}
    - {profile_id: cave-squig, minimum: 0, maximum: 5}
    - {profile_id: troll, minimum: 0, maximum: 1}
