      - {item_id: spear, cost: 10}
      - {item_id: halberd, cost: 10}
      - {item_id: chained_club, cost: 10}
      - {item_id: great_weapon, cost: 15}
      - {item_id: flail, cost: 15}
      - {item_id: choppa, cost: 15}
      - {item_id: bow, cost: 10}
      - {item_id: crossbow, cost: 25}
      - {item_id: shield, cost: 5}
      - {item_id: helmet, cost: 10}
      - {item_id: light_armour, cost: 20}
      - {item_id: mad_cap_mushrooms, cost: 25}
  - id: goblin-equipment
    name: Equipo para Goblins
    source: {manual: caos-en-las-calles, printed_page: 131, section: Lista de Equipo para Goblins}
    items:
      - {item_id: dagger, cost: 2, notes: La primera es gratis}
      - {item_id: sword, cost: 10}
      - {item_id: spear, cost: 10}
      - {item_id: squig_prodder, cost: 15}
      - {item_id: ball_and_chain, cost: 25, notes: La ficha del objeto en la página 128 dice 15 coronas; la lista de compra de la página 131 dice 25. La discrepancia también existe en el manual completo}
