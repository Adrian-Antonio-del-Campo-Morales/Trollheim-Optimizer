id: lustria-altos-elfos
name: Altos Elfos
source: {manual: lustria, printed_page: 112-119, section: Altos Elfos}
roster:
  minimum_models: 3
  maximum_models: 12
  starting_gold: 500
  members:
    - {profile_id: high-elf-loremaster, minimum: 1, maximum: 1}
    - {profile_id: high-elf-sword-guardian, minimum: 0, maximum: 2}
    - {profile_id: high-elf-explorer, minimum: 0, maximum: 2}
    - {profile_id: high-elf-sea-guard, minimum: 0, maximum: null}
    - {profile_id: high-elf-cadet, minimum: 0, maximum: 5}
equipment_lists:
  - id: high-elf-equipment
    name: Equipo para Altos Elfos
    source: {manual: lustria, printed_page: 113, section: Lista de Equipo para Altos Elfos}
    items:
      - {item_id: dagger, cost: 2, notes: La primera es gratis}
      - {item_id: axe, cost: 5}
      - {item_id: halberd, cost: 10}
      - {item_id: sword, cost: 10}
      - {item_id: spear, cost: 10}
      - {item_id: great_weapon, cost: 15}
      - {item_id: mage_staff, cost: 20, notes: Solo Maestro del Conocimiento}
      - {item_id: elven_greatsword, cost: 25}
      - {item_id: ithilmar_weapon, cost: 2x_base_cost, notes: Solo durante la creación de la banda según esta lista}
      - {item_id: long_bow, cost: 15}
      - {item_id: elven_bow, cost: 35, notes: Solo durante la creación de la banda}
      - {item_id: shield, cost: 5}
      - {item_id: helmet, cost: 10}
      - {item_id: light_armour, cost: 20}
      - {item_id: ithilmar_armour, cost: 60, notes: Solo durante la creación de la banda}
      - {item_id: elven_wine, cost: 30, notes: Solo durante la creación; su descripción da 30+3D6 después}
      - {item_id: elven_runestones, cost: 50, notes: Solo durante la creación; su descripción da 50+2D6 después}
      - {item_id: elven_cloak, cost: 60, notes: Solo durante la creación de la banda}
  - id: high-elf-cadet-equipment
    name: Equipo para Cadetes
    source: {manual: lustria, printed_page: 113, section: Lista de Equipo para Cadetes}
    items:
      - {item_id: dagger, cost: 2, notes: La primera es gratis}
      - {item_id: axe, cost: 5}
      - {item_id: sword, cost: 10}
      - {item_id: spear, cost: 10}
      - {item_id: bow, cost: 10}
      - {item_id: long_bow, cost: 15}
      - {item_id: elven_bow, cost: 35, notes: Solo durante la creación de la banda}
      - {item_id: shield, cost: 5}
      - {item_id: helmet, cost: 10}
      - {item_id: light_armour, cost: 20}
profiles:
  - id: high-elf-loremaster
    name: Maestro del Conocimiento
    type: hero
    cost: 80
    experience: 20
    characteristics: {M: 12, WS: 4, BS: 4, S: 3, T: 3, W: 1, I: 6, A: 1, Ld: 9}
    equipment_lists: [high-elf-equipment]
    fixed_equipment: []
    equipment_restrictions: [No puede utilizar armas de pólvora, drogas ni venenos]
    skill_access: [academic, speed, special]
    rules:
      - {id: high-elf-leader, name: Jefe, effect: Los guerreros a 15 cm o menos pueden utilizar su Liderazgo., source: {manual: lustria, printed_page: 116, section: Maestro del Conocimiento}}
      - {id: high-elf-spellcaster, name: Hechicero, effect: Usa Alta Magia Élfica y comienza con un hechizo al azar. Al obtener uno nuevo puede escogerlo de Alta Magia Élfica o Magia Menor; sus reglas individuales quedan fuera del alcance canónico actual., source: {manual: lustria, printed_page: 116, section: Maestro del Conocimiento}}
    source: {manual: lustria, printed_page: 116, section: Maestro del Conocimiento}
  - id: high-elf-sword-guardian
    name: Guardián de la Espada
    type: hero
    cost: 50
    experience: 11
    characteristics: {M: 12, WS: 5, BS: 4, S: 3, T: 3, W: 1, I: 6, A: 1, Ld: 8}
    equipment_lists: [high-elf-equipment]
    fixed_equipment: []
    equipment_restrictions: [No puede utilizar armas de proyectiles, No puede utilizar armas de pólvora, drogas ni venenos]
    skill_access: [combat, academic, strength, speed, special]
    rules:
      - {id: high-elf-swordmaster-protection, name: Protección de los Maestros de la Espada, effect: Mientras porte espada o espada élfica a dos manos, los disparos contra él sufren -1 para impactar. No afecta a pólvora., source: {manual: lustria, printed_page: 117, section: Guardianes de la Espada}}
    source: {manual: lustria, printed_page: 117, section: Guardianes de la Espada}
  - id: high-elf-explorer
    name: Explorador
    type: hero
    cost: 45
    experience: 8
    characteristics: {M: 12, WS: 4, BS: 4, S: 3, T: 3, W: 1, I: 6, A: 1, Ld: 8}
    equipment_lists: [high-elf-equipment]
    fixed_equipment: []
    equipment_restrictions: [No puede utilizar armas de pólvora, drogas ni venenos]
    skill_access: [shooting, speed, special]
    rules:
      - {id: high-elf-searcher, name: Buscador, effect: Si no queda fuera de combate puede modificar en +1 o -1 un dado de exploración., source: {manual: lustria, printed_page: 116, section: Exploradores}}
    source: {manual: lustria, printed_page: 116, section: Exploradores}
  - id: high-elf-sea-guard
    name: Guardia del Mar
    type: henchman
    cost: 35
    experience: 0
    characteristics: {M: 12, WS: 4, BS: 4, S: 3, T: 3, W: 1, I: 6, A: 1, Ld: 8}
    equipment_lists: [high-elf-equipment]
    fixed_equipment: []
    equipment_restrictions: [No puede utilizar armas de pólvora, drogas ni venenos]
    skill_access: []
    rules: []
    source: {manual: lustria, printed_page: 118, section: Guardia del Mar}
  - id: high-elf-cadet
    name: Cadete
    type: henchman
    cost: 30
    experience: 0
    characteristics: {M: 12, WS: 3, BS: 3, S: 3, T: 3, W: 1, I: 5, A: 1, Ld: 8}
    equipment_lists: [high-elf-cadet-equipment]
    fixed_equipment: []
    equipment_restrictions: [No puede utilizar armas de pólvora, drogas ni venenos]
    skill_access: []
    rules: []
    source: {manual: lustria, printed_page: 118, section: Cadetes}
band_rules:
  - {id: high-elf-excellent-sight, name: Visión excelente, effect: Detectan enemigos ocultos al doble de la distancia normal; dos veces su Iniciativa en centímetros., source: {manual: lustria, printed_page: 114, section: Reglas Especiales de los Altos Elfos}}
  - {id: high-elf-haughty, name: Altivos, effect: No pueden contratar Espadas de Alquiler que no sean Elfos ni usar equipo enano, incluido Gromril y Obsidiana., source: {manual: lustria, printed_page: 114, section: Reglas Especiales de los Altos Elfos}}
  - {id: high-elf-honourable, name: Honorables, effect: No pueden usar drogas ni venenos bajo ninguna circunstancia., source: {manual: lustria, printed_page: 114, section: Reglas Especiales de los Altos Elfos}}
  - {id: high-elf-ancestral-customs, name: Costumbres ancestrales, effect: No pueden utilizar armas de pólvora., source: {manual: lustria, printed_page: 114, section: Reglas Especiales de los Altos Elfos}}
  - {id: high-elf-determination, name: Determinación, effect: Contra Elfos Oscuros se considera que tienen Liderazgo 10 para retirarse y no pueden retirarse voluntariamente., source: {manual: lustria, printed_page: 114, section: Reglas Especiales de los Altos Elfos}}
  - {id: high-elf-wine, name: Vino Élfico, effect: Cuesta 30+3D6 coronas, rareza 10 y un solo uso. Bebido antes de la batalla hace inmune al miedo a toda la banda durante esa batalla; solo puede comprarse uno por batalla., source: {manual: lustria, printed_page: 114, section: Vino Élfico}}
  - {id: high-elf-runestones, name: Piedras Rúnicas Élficas, effect: Cuestan 50+2D6 coronas y tienen rareza 11. El Maestro puede intentar dispersar un hechizo dirigido contra él o un aliado a 45 cm o menos superando la tirada de lanzamiento rival; Hechicería no ayuda., source: {manual: lustria, printed_page: 114, section: Piedras Rúnicas Élficas}}
  - {id: high-elf-mage-staff, name: Bastón de Mago, effect: Cuesta 20 coronas y tiene rareza 10. Arma de Fuerza del usuario +1 que puede usarse con una o dos manos; a dos manos no da +1 Fuerza adicional ni se combina con otra arma o armadura. Un 2-4 en la Tabla de Heridas cuenta como inconsciente., source: {manual: lustria, printed_page: 115, section: Bastón de Mago}}
  - {id: familiar, name: Familiar, effect: Cuesta 20+1D6 coronas y tiene rareza 8. Solo un hechicero puede invocarlo, pagando aunque falle la disponibilidad. Se considera equipo, permanece en contacto con el mago y es ignorado como miniatura. Permite repetir una tirada fallida para lanzar un hechizo por turno, aceptando el segundo resultado. No sirve a usuarios de plegarias., source: {manual: lustria, printed_page: 115, section: Familiar}}
  - {id: high-elf-skill-elven-agility, name: Agilidad élfica, effect: Evita ataques y proyectiles con 6+. Si también posee Esquivar o Echarse a un lado, esas salvaciones pasan a 4+ y Agilidad élfica deja de aplicarse al tipo correspondiente., source: {manual: lustria, printed_page: 119, section: Habilidades Especiales de los Altos Elfos}}
  - {id: high-elf-skill-rune-master, name: Maestro de las runas, effect: Solo Maestro. Las Piedras Rúnicas obtienen +1 al dispersar. Una vez por batalla puede inscribir una runa en arma o armadura de un aliado para repetir una salvación por armadura o una parada; después pierde poder., source: {manual: lustria, printed_page: 119, section: Habilidades Especiales de los Altos Elfos}}
  - {id: high-elf-skill-miniath, name: Miniath, effect: Si usa un arma capaz de parar puede repetir una parada fallida., source: {manual: lustria, printed_page: 119, section: Habilidades Especiales de los Altos Elfos}}
  - {id: high-elf-skill-infallible-strike, name: Golpe Infalible, effect: Puede repetir cualquier tirada para herir fallida., source: {manual: lustria, printed_page: 119, section: Habilidades Especiales de los Altos Elfos}}
  - {id: high-elf-skill-stand-and-shoot, name: Aguantar y Disparar, effect: Al superar Liderazgo cuando recibe una carga puede disparar al agresor antes del contacto con -1 para impactar. Si el agresor queda Derribado o Aturdido se coloca a mitad de la distancia de carga., source: {manual: lustria, printed_page: 119, section: Habilidades Especiales de los Altos Elfos}}
  - {id: high-elf-skill-faerie, name: Faérico, effect: Solo Exploradores. Los hechizos enemigos no le afectan con 4+ en 1D6., source: {manual: lustria, printed_page: 119, section: Habilidades Especiales de los Altos Elfos}}
  - {id: high-elf-skill-luck, name: Suerte, effect: Solo Exploradores. Una vez por batalla puede repetir cualquier tirada propia, pero no una tirada hecha por otro miembro., source: {manual: lustria, printed_page: 119, section: Habilidades Especiales de los Altos Elfos}}
