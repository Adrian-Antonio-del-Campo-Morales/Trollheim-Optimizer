band_rules:
  - {id: lizardman-scaly-skin, name: Piel escamosa, effect: La salvación natural se combina con armaduras salvo cuero endurecido. La Fuerza no puede empeorarla más allá de 6+, pero un resultado que niegue salvaciones en la Tabla de Heridas también niega esa salvación de 6+., source: {manual: lustria, printed_page: 53, section: Reglas Especiales de los Hombres Lagarto}}
  - {id: lizardman-poisoned-weapons, name: Armas envenenadas, effect: Veneno negro, loto negro y veneno de reptil son comunes para los Hombres Lagarto., source: {manual: lustria, printed_page: 53, section: Reglas Especiales de los Hombres Lagarto}}
  - {id: lizardman-cold-blooded, name: Sangre fría, effect: En chequeos de retirada y psicología tira 3D6 y conserva los dos resultados más bajos. Para retirarse nunca puede usar el Liderazgo de un Saurio ni de un Króxigor., source: {manual: lustria, printed_page: 53, section: Reglas Especiales de los Hombres Lagarto}}
  - {id: lizardman-saurus-rarity, name: Rareza de saurio, effect: El número de Bravos Saurios siempre debe ser inferior al de Bravos Eslizones., source: {manual: lustria, printed_page: 53, section: Reglas Especiales de los Hombres Lagarto}}
  - {id: lizardman-special-skill-infiltration, name: Infiltración, effect: Solo Eslizones. Puede desplegarse en cualquier lugar a al menos 30 cm del enemigo y debe empezar oculto., source: {manual: lustria, printed_page: 57, section: Habilidades Especiales de los Hombres Lagarto}}
  - {id: lizardman-special-skill-great-hunter, name: Gran Cazador, effect: Solo Eslizones. Cuando está bajo cobertura, los ataques contra él sufren un -1 adicional para impactar., source: {manual: lustria, printed_page: 57, section: Habilidades Especiales de los Hombres Lagarto}}
  - {id: lizardman-special-skill-battle-roar, name: Rugido de batalla, effect: Solo Saurios. Los enemigos en contacto sufren -1 para impactar durante la primera ronda de combate., source: {manual: lustria, printed_page: 57, section: Habilidades Especiales de los Hombres Lagarto}}
  - {id: lizardman-special-skill-hardened-skin, name: Piel endurecida, effect: Solo Saurios. Solo queda fuera de combate con un resultado de 6+., source: {manual: lustria, printed_page: 57, section: Habilidades Especiales de los Hombres Lagarto}}
  - {id: lizardman-sacred-marks, name: Marcas Sagradas, effect: Un héroe solo puede tener una marca sagrada y únicamente puede adquirirla al ser reclutado., source: {manual: lustria, printed_page: 57, section: Marcas Sagradas}}
  - {id: lizardman-mark-huge-jaws, name: Fauces descomunales, effect: Cuesta 40 coronas y es solo para Saurios. Su ataque de mordisco obtiene +1 Fuerza., source: {manual: lustria, printed_page: 57, section: Marcas Sagradas}}
  - {id: lizardman-mark-venom-glands, name: Glándulas venenosas, effect: Cuesta 40 coronas y es solo para Eslizones. Puede atacar con sus dientes en vez de armas; se resuelve como un mordisco después de sus armas, aplica -1 a la salvación con independencia de su Fuerza y +1 en la Tabla de Heridas., source: {manual: lustria, printed_page: 57, section: Marcas Sagradas}}
  - {id: lizardman-mark-ancestors, name: Marca de los Ancestrales, effect: Cuesta 50 coronas, solo puede llevarla un héroe y se usa una vez por partida para cambiar uno de sus dados por cualquier resultado válido., source: {manual: lustria, printed_page: 57, section: Marcas Sagradas}}
