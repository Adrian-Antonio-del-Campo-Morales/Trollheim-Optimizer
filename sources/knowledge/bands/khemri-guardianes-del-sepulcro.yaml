id: khemri-guardianes-del-sepulcro
name: Guardianes del Sepulcro
source: {manual: khemri, printed_page: 40-47, section: Guardianes del Sepulcro}
roster:
  minimum_models: 3
  maximum_models: 15
  starting_gold: 500
  members:
    - {profile_id: tomb-lord, minimum: 1, maximum: 1}
    - {profile_id: mortuary-priest, minimum: 0, maximum: 1}
    - {profile_id: necrotect, minimum: 0, maximum: 1}
    - {profile_id: mortuary-acolyte, minimum: 0, maximum: 3}
    - {profile_id: skeleton-warrior, minimum: 0, maximum: null}
    - {profile_id: tomb-guard, minimum: 0, maximum: 2}
    - {profile_id: giant-scorpion, minimum: 0, maximum: 3}
    - {profile_id: stone-golem, minimum: 0, maximum: 1}
