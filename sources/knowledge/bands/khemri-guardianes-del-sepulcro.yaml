    equipment_lists: [tomb-undead-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: [combat, academic, strength]
    rules:
      - {id: undead, name: No Muerto, effect: Está sujeto a las reglas de No Muertos de la banda., source: {manual: khemri, printed_page: 45, section: Necrotecto}}
      - {id: necrotect-hatred, name: Odio, effect: Puede repetir tiradas fallidas para impactar durante la primera ronda de cada combate., source: {manual: khemri, printed_page: 45, section: Necrotecto}}
      - {id: necrotect-stone-forger, name: Forjador de Piedra, effect: Los Gólems de Piedra a 15 cm o menos obtienen regeneración de 6+., source: {manual: khemri, printed_page: 45, section: Necrotecto}}
    source: {manual: khemri, printed_page: 45, section: Necrotecto}
