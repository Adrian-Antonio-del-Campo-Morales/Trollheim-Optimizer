    type: henchman
    cost: 20
    experience: 0
    characteristics: {M: 10, WS: 2, BS: 2, S: 3, T: 3, W: 1, I: 2, A: 1, Ld: 5}
    equipment_lists: [tomb-undead-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: []
    rules: [{id: undead, name: No Muerto, effect: Está sujeto a las reglas de No Muertos de la banda y no gana experiencia., source: {manual: khemri, printed_page: 46, section: Guerreros Esqueleto}}]
    source: {manual: khemri, printed_page: 46, section: Guerreros Esqueleto}
  - id: tomb-guard
    name: Guardia del Sepulcro
    type: henchman
    cost: 40
    experience: 0
    characteristics: {M: 10, WS: 3, BS: 2, S: 4, T: 3, W: 1, I: 3, A: 1, Ld: 5}
    equipment_lists: [tomb-undead-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: []
    rules: [{id: undead, name: No Muerto, effect: Está sujeto a las reglas de No Muertos de la banda y no gana experiencia., source: {manual: khemri, printed_page: 46, section: Guardianes del Sepulcro}}]
    source: {manual: khemri, printed_page: 46, section: Guardianes del Sepulcro}
