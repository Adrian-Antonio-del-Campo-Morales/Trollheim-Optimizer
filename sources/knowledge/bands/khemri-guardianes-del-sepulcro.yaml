    equipment_restrictions: [No puede llevar armadura]
    skill_access: [combat, academic]
    rules: [{id: undead, name: No Muerto, effect: Está sujeto a las reglas de No Muertos de la banda., source: {manual: khemri, printed_page: 45, section: Acólitos}}]
