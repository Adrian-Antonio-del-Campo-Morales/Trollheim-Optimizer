    name: Escorpión Gigante
    type: henchman
    cost: 15
    experience: 0
    characteristics: {M: 12, WS: 2, BS: 0, S: 2, T: 2, W: 1, I: 4, A: 1, Ld: 4}
    equipment_lists: []
    fixed_equipment: [Aguijón]
    equipment_restrictions: [No puede utilizar equipo]
    skill_access: []
    rules:
      - {id: living, name: Viven, effect: Es un ser vivo y usa psicología normal, pero no necesita agua., source: {manual: khemri, printed_page: 46, section: Escorpiones de la tumba}}
      - {id: animal, name: Animal, effect: No gana experiencia., source: {manual: khemri, printed_page: 46, section: Escorpiones de la tumba}}
      - {id: scorpion-sting, name: Picadura de escorpión, effect: Sus ataques usan el efecto de Loto Negro., source: {manual: khemri, printed_page: 46, section: Escorpiones de la tumba}}
    source: {manual: khemri, printed_page: 46, section: Escorpiones de la tumba}
  - id: stone-golem
    name: Gólem de Piedra
    type: henchman
    cost: 150
    experience: 0
    characteristics: {M: 8, WS: 3, BS: 0, S: 5, T: 4, W: 3, I: 1, A: 2, Ld: 5}
    equipment_lists: []
    fixed_equipment: []
    equipment_restrictions: [No puede utilizar equipo, No sufre penalización por combatir desarmado]
    skill_access: []
    rules:
      - {id: stone-golem-armour, name: Cuerpo de piedra, effect: Tiene salvación natural de 4+., source: {manual: khemri, printed_page: 47, section: Gólem de Piedra}}
      - {id: causes-fear, name: Causa miedo, effect: Causa miedo., source: {manual: khemri, printed_page: 47, section: Gólem de Piedra}}
      - {id: immune-psychology, name: Inmune a psicología, effect: Es inmune a psicología y nunca abandona el combate., source: {manual: khemri, printed_page: 47, section: Gólem de Piedra}}
      - {id: immune-poison, name: Inmune a venenos, effect: Es inmune a venenos., source: {manual: khemri, printed_page: 47, section: Gólem de Piedra}}
      - {id: brainless, name: Sin cerebro, effect: No gana experiencia., source: {manual: khemri, printed_page: 47, section: Gólem de Piedra}}
      - {id: impossible-hide, name: Imposible de ocultar, effect: No puede ocultarse., source: {manual: khemri, printed_page: 47, section: Gólem de Piedra}}
      - {id: large-target, name: Grande, effect: Puede recibir disparos aunque no sea el objetivo más cercano., source: {manual: khemri, printed_page: 47, section: Gólem de Piedra}}
      - {id: no-water, name: No comen, effect: No necesita agua., source: {manual: khemri, printed_page: 47, section: Gólem de Piedra}}
      - {id: animated, name: Animado, effect: Es un ser animado, no un No Muerto., source: {manual: khemri, printed_page: 47, section: Gólem de Piedra}}
    source: {manual: khemri, printed_page: 47, section: Gólem de Piedra}
band_rules:
  - {id: tomb-undead-rules, name: Reglas de los No Muertos, effect: Causan miedo, son inmunes a psicología y venenos, consideran Aturdido como Derribado, no necesitan alimento ni agua y no pueden correr aunque sí cargar. Los secuaces con esta regla no ganan experiencia; Señor, Sacerdote y Acólitos sí pueden aprender o recordar habilidades., source: {manual: khemri, printed_page: 43, section: Reglas especiales de los No Muertos}}
  - {id: tomb-at-home, name: En Casa, effect: En Khemri tira un dado adicional durante la exploración., source: {manual: khemri, printed_page: 43, section: Reglas especiales de los No Muertos}}
  - {id: nehekhara-javelin, name: Jabalina Nehekhara, effect: Alcance 20 cm, Fuerza del usuario y +1 para impactar., source: {manual: khemri, printed_page: 42, section: Jabalina Nehekhara}}
  - {id: asp-arrows, name: Flechas Áspid, effect: Conceden +1 para impactar., source: {manual: khemri, printed_page: 42, section: Flechas Áspid}}
  - {id: serpent-staff, name: Báculo de Serpiente, effect: Arma a dos manos de Fuerza del usuario que permite Parada. El Sacerdote puede renunciar a todos sus ataques para efectuar uno que Ataca Primero con HA4 y F4., source: {manual: khemri, printed_page: 42, section: Báculo de Serpiente}}
  - {id: bone-chariot, name: Carro de Hueso, effect: Cuesta 200+10D6 coronas, rareza 7 y solo puede haber uno. Concede salvación 5+, mueve 20 cm, no corre y dobla al cargar. Terreno difícil causa D3 impactos F4 o 2D3 F6 durante carga. Perder un corcel reduce Movimiento a la mitad; perder ambos lo inmoviliza. Al mover más de la mitad arrolla con una herida F4 y -2 a salvación a quien falle Iniciativa en su línea. Es objetivo grande y los disparos impactan con +1; al impactar se reparte en 1-2 corcel, 3-4 carro y 5-6 conductor., source: {manual: khemri, printed_page: 42, section: Carro de Hueso}}
