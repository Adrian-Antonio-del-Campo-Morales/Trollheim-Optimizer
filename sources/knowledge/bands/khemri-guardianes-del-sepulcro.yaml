      - {item_id: mace, cost: 3}
      - {item_id: bronze_axe, cost: 5}
      - {item_id: bronze_sword, cost: 10}
      - {item_id: halberd, cost: 10}
      - {item_id: bronze_spear, cost: 10}
      - {item_id: flail, cost: 15}
      - {item_id: great_weapon, cost: 15}
      - {item_id: morning_star, cost: 15}
      - {item_id: bow, cost: 10}
      - {item_id: asp_arrows, cost: 10, notes: Solo Señor Funerario}
      - {item_id: nehekhara_javelin, cost: 10, notes: Solo Señor Funerario}
      - {item_id: shield, cost: 5}
      - {item_id: bronze_helmet, cost: 10}
      - {item_id: bronze_breastplate, cost: 20, notes: Armadura ligera}
