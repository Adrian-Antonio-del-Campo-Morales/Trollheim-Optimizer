profiles:
  - id: tomb-lord
    name: Señor Funerario
    type: hero
    cost: 90
    experience: 20
    characteristics: {M: 10, WS: 4, BS: 3, S: 4, T: 4, W: 2, I: 3, A: 1, Ld: 8}
    equipment_lists: [tomb-undead-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: [combat, shooting, strength]
    rules:
      - {id: tomb-lord-leader, name: Jefe, effect: Los guerreros a 15 cm o menos pueden utilizar su Liderazgo., source: {manual: khemri, printed_page: 44, section: Señor Funerario}}
      - {id: undead, name: No Muerto, effect: Está sujeto a las reglas de No Muertos de la banda., source: {manual: khemri, printed_page: 44, section: Señor Funerario}}
      - {id: tomb-lord-flammable, name: Inflamable, effect: Las heridas de fuego causan el doble de heridas., source: {manual: khemri, printed_page: 43, section: Reglas especiales de los No Muertos}}
    source: {manual: khemri, printed_page: 44, section: Señor Funerario}
  - id: mortuary-priest
    name: Sacerdote Funerario
    type: hero
    cost: 50
    experience: 6
    characteristics: {M: 10, WS: 2, BS: 2, S: 3, T: 3, W: 1, I: 3, A: 1, Ld: 8}
    equipment_lists: [mortuary-priest-equipment]
    fixed_equipment: []
    equipment_restrictions: [No puede llevar armadura]
    skill_access: [academic]
    rules:
      - {id: mortuary-priest-spellcaster, name: Hechicero, effect: Puede utilizar los pergaminos de los Sacerdotes Funerarios; sus efectos individuales quedan fuera del alcance canónico actual., source: {manual: khemri, printed_page: 44, section: Sacerdote Funerario}}
      - {id: undead, name: No Muerto, effect: Está sujeto a las reglas de No Muertos de la banda., source: {manual: khemri, printed_page: 44, section: Sacerdote Funerario}}
    source: {manual: khemri, printed_page: 44, section: Sacerdote Funerario}
