    name: Equipo para Sacerdotes Funerarios
    source: {manual: khemri, printed_page: 41, section: Lista de equipo para Sacerdotes Funerarios}
    items:
      - {item_id: bronze_dagger, cost: 2, notes: La primera es gratis}
      - {item_id: mace, cost: 3}
