    source: {manual: lustria, printed_page: 103, section: Zomblins}
  - id: savage-goblin-zomblintua
    name: Zomblintua
    type: henchman
    cost: 195
    experience: 0
    characteristics: {M: 12, WS: 3, BS: 0, S: 4, T: 5, W: 3, I: 1, A: 2, Ld: 6}
    equipment_lists: []
    fixed_equipment: []
    equipment_restrictions: [No puede utilizar equipo, Requiere sacrificar tres Zomblins además de pagar el coste]
    skill_access: []
    rules:
      - {id: savage-goblin-zomblintua-construction, name: Construcción, effect: Requiere que la banda tenga al menos tres Zomblins y sacrificarlos además de pagar 195 coronas., source: {manual: lustria, printed_page: 104, section: Zomblintua}}
      - {id: undead-no-run, name: No pueden correr, effect: No puede correr, pero sí cargar normalmente., source: {manual: lustria, printed_page: 104, section: Zomblintua}}
      - {id: causes-fear, name: Causan miedo, effect: Causa miedo., source: {manual: lustria, printed_page: 104, section: Zomblintua}}
      - {id: immune-psychology, name: Inmunes a psicología, effect: Es inmune a psicología y no abandona el combate., source: {manual: lustria, printed_page: 104, section: Zomblintua}}
      - {id: immune-poison, name: Inmunes a los venenos, effect: Es inmune a venenos., source: {manual: lustria, printed_page: 104, section: Zomblintua}}
      - {id: insensible-pain, name: Insensible al dolor, effect: Considera Aturdido como Derribado., source: {manual: lustria, printed_page: 104, section: Zomblintua}}
      - {id: brainless, name: Sin cerebro, effect: No gana experiencia., source: {manual: lustria, printed_page: 104, section: Zomblintua}}
      - {id: large-target, name: Objetivo grande, effect: Puede recibir disparos aunque no sea el objetivo más cercano y se obtiene +1 para impactarle con proyectiles., source: {manual: lustria, printed_page: 104, section: Zomblintua}}
      - {id: savage-goblin-zomblintua-regeneration, name: Regeneración, effect: Cada herida se ignora con 5+ en 1D6. No regenera fuego ni magia ígnea y las heridas de fuego se duplican. Tira tras la batalla para ignorar efectos de heridas graves salvo las de fuego., source: {manual: lustria, printed_page: 104, section: Zomblintua}}
    source: {manual: lustria, printed_page: 104, section: Zomblintua}
band_rules:
  - {id: savage-goblin-jungle-native, name: Nativos de la jungla, effect: No sufren penalizadores al moverse por bosques ni vegetación., source: {manual: lustria, printed_page: 98, section: Reglas Especiales de los Goblins Zalvajes}}
  - {id: savage-goblin-unpleasant-company, name: Compañía desagradable, effect: Solo pueden contratar Luchador de Pozo, Guardaespaldas Ogro y Hechicero como Espadas de Alquiler, y estos deben ser pieles verdes si se indica lo contrario., source: {manual: lustria, printed_page: 98, section: Reglas Especiales de los Goblins Zalvajes}}
  - {id: savage-goblin-camouflage, name: Camuflaje, effect: Un Goblin sin armadura, salvo cuero endurecido, no puede ser detectado hasta que el atacante supere Iniciativa., source: {manual: lustria, printed_page: 98, section: Reglas Especiales de los Goblins Zalvajes}}
  - {id: savage-goblin-fear-elves, name: Miedo a los Orejas Picudas, effect: Tienen miedo de los Elfos., source: {manual: lustria, printed_page: 98, section: Reglas Especiales de los Goblins Zalvajes}}
  - {id: savage-goblin-animosity, name: Animosidad, effect: "Al inicio del turno tira 1D6 por cada Goblin que no esté trabado; con 1 se ofende con el aliado más cercano. Después tira 1D6: con 1 carga o dispara al aliado si puede y si no no actúa; con 2-5 no hace nada salvo defenderse; con 6 mueve inmediatamente hacia el enemigo visible más cercano y debe cargar si alcanza distancia.", source: {manual: lustria, printed_page: 98, section: Animosidad}}
  - {id: sacrifice-dagger, name: Daga de Zakrificioz, effect: Cuesta 10 coronas y concede +1 a la salvación enemiga. Antes de la batalla el Médiko puede sacrificar un miembro o cautivo; ambos tiran Iniciativa y, si gana el Médiko, obtiene +1 a lanzar hechizos y +1 Liderazgo. Los Zomblins no son sacrificios válidos y el sacrificado no puede transformarse., source: {manual: lustria, printed_page: 99, section: Daga de Zakrificioz}}
  - {id: spider-chitin-armour, name: Armadura Kitinoza, effect: Cuesta 80 coronas y tiene rareza 11. Su salvación es 6 en 1D6, concede salvación especial de 6 contra magia, duplica heridas por fuego y permite escalar como con la habilidad correspondiente., source: {manual: lustria, printed_page: 99, section: Armadura Kitinoza}, conditions: [La lista de equipo de la página 97 indica 70 coronas]}
  - {id: shrunken-head, name: Cabeza Reduzidaz, effect: Cuesta 25 coronas y tiene rareza 6. Arma arrojadiza de 15 cm y Fuerza 2 sin penalización por alcance o movimiento; no se usa en cuerpo a cuerpo. El impactado hace inmediatamente Pánico, salvo inmunes a psicología, Grandes o Bestias Enormes., source: {manual: lustria, printed_page: 99, section: Cabeza Reduzidaz}}
  - {id: feather-headdress, name: Tokado de Plumaz, effect: Cuesta 20 coronas y tiene rareza 6. El Jefe puede repetir Liderazgo y una vez por batalla un chequeo de retirada. Si muere, el nuevo Jefe recupera automáticamente el tocado y debe llevarlo., source: {manual: lustria, printed_page: 99, section: Tokado de Plumaz}}
  - {id: savage-goblin-skill-infiltration, name: Infiltración, effect: No pueden adquirirla Dientez Rojoz ni Médiko Brujo. Despliega tras el enemigo, fuera de su línea de visión y a más de 30 cm de cualquier enemigo., source: {manual: lustria, printed_page: 105, section: Habilidades Especiales de los Goblins Zalvajes}}
  - {id: savage-goblin-skill-unpredictable, name: Impredezible, effect: Puede declarar impredecible uno de sus ataques y ese ataque no puede ser parado., source: {manual: lustria, printed_page: 105, section: Habilidades Especiales de los Goblins Zalvajes}}
  - {id: savage-goblin-skill-zomblin-medicine, name: Medizina Zomblin, effect: Solo Médiko Brujo. En futuras subidas puede elegir un hechizo de magia nigromántica en vez de una habilidad; Zomblins y Zomblintua cuentan como zombis para esos hechizos. Los efectos concretos de magia quedan fuera del alcance actual., source: {manual: lustria, printed_page: 105, section: Habilidades Especiales de los Goblins Zalvajes}}
  - {id: savage-goblin-skill-spider-infested, name: Infestado de Arañaz, effect: Cada vez que un enemigo falle para impactarle o él pare, el enemigo recibe -1 Iniciativa acumulativo hasta dejar de estar trabado o quedar fuera de combate., source: {manual: lustria, printed_page: 105, section: Habilidades Especiales de los Goblins Zalvajes}}
  - {id: savage-goblin-skill-three-weapons, name: Maezto en Armaz ke ze Tiran, effect: Solo Montarazes. Puede equiparse con hasta cinco armas a distancia en vez de dos., source: {manual: lustria, printed_page: 105, section: Habilidades Especiales de los Goblins Zalvajes}}
