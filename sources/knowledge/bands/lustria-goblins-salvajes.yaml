    fixed_equipment: [Cuerda, Garfio, Bolas]
    equipment_restrictions: [No puede vender ni transferir su cuerda, garfio o bolas; se reponen gratis]
    skill_access: [combat, shooting, speed, special]
    rules:
      - {id: savage-goblin-tracker-kit, name: Kachivachez de Montaraz, effect: Comienza con cuerda, garfio y bolas; no pueden venderse ni darse y se reponen gratis si se pierden., source: {manual: lustria, printed_page: 101, section: Montarazes}}
    source: {manual: lustria, printed_page: 101, section: Montarazes}
