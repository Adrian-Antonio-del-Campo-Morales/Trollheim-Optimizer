profiles:
  - id: savage-goblin-witch-doctor
    name: Médiko Brujo
    type: hero
    cost: 65
    experience: 20
    characteristics: {M: 10, WS: 3, BS: 4, S: 3, T: 3, W: 1, I: 3, A: 1, Ld: 6}
    equipment_lists: [savage-goblin-hero-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: [academic, speed, special]
    rules:
      - {id: savage-goblin-leader, name: Jefe, effect: Los guerreros a 15 cm o menos pueden utilizar su Liderazgo., source: {manual: lustria, printed_page: 100, section: Médiko Brujo}}
      - {id: savage-goblin-spellcaster, name: Hechicero, effect: Usa la magia del Pequeño WAAAGH Forestal y comienza con un hechizo al azar; sus reglas individuales quedan fuera del alcance canónico actual., source: {manual: lustria, printed_page: 100, section: Médiko Brujo}}
      - {id: savage-goblin-return-from-darkness, name: Volver de la Ozkuridad, effect: Puede añadir gratis un Zomblin por cada Goblin Primitivo muerto, hasta el máximo de banda. Si mueren más de seis, los siguientes solo se reaniman con 4+ en 1D6. Nunca puede haber más de cinco Zomblins., source: {manual: lustria, printed_page: 100, section: Médiko Brujo}}
    source: {manual: lustria, printed_page: 100, section: Médiko Brujo}
  - id: savage-goblin-big-boss
    name: Gran Jefe
    type: hero
    cost: 50
    experience: 10
    characteristics: {M: 10, WS: 3, BS: 4, S: 3, T: 3, W: 1, I: 4, A: 1, Ld: 7}
    equipment_lists: [savage-goblin-hero-equipment]
    fixed_equipment: []
    equipment_restrictions: []
    skill_access: [combat, shooting, speed, special]
    rules:
      - {id: savage-goblin-second-in-command, name: Segundo al mando, effect: Actúa como Jefe cuando no puede usarse el Liderazgo del Médiko Brujo. Si este muere, el Gran Jefe deja de ser Jefe al reclutarse otro Médiko., source: {manual: lustria, printed_page: 100, section: Gran Jefe}}
    source: {manual: lustria, printed_page: 100, section: Gran Jefe}
  - id: savage-goblin-red-tooth
    name: Dientez Rojoz
    type: hero
    cost: 35
    experience: 6
    characteristics: {M: 10, WS: 3, BS: 3, S: 3, T: 3, W: 1, I: 3, A: 1, Ld: 6}
    equipment_lists: [savage-goblin-hero-equipment]
    fixed_equipment: []
