      - {id: causes-fear, name: Causan miedo, effect: Causa miedo., source: {manual: lustria, printed_page: 103, section: Zomblins}}
      - {id: immune-psychology, name: Inmunes a psicología, effect: Es inmune a psicología y no abandona el combate., source: {manual: lustria, printed_page: 103, section: Zomblins}}
