    source: {manual: khemri, printed_page: 81, section: Arqueroz}
  - id: hobgoblin-giant-wolf
    name: Lobo Gigante
    type: henchman
    cost: 50
    experience: 0
    characteristics: {M: 22, WS: 4, BS: 0, S: 3, T: 3, W: 1, I: 3, A: 1, Ld: 3}
    equipment_lists: []
    fixed_equipment: []
    equipment_restrictions: [No utiliza armas ni armaduras]
    skill_access: []
    rules:
      - {id: hobgoblin-wolf-animal, name: Animales, effect: No gana experiencia., source: {manual: khemri, printed_page: 81, section: Lobos Gigantes}}
      - {id: hobgoblin-wolf-mount, name: Cabalgaduras, effect: Los lobos de la batalla deben ser montados por miembros de la banda y el jinete no desmonta voluntariamente. Si el jinete queda fuera de combate, el lobo supera Liderazgo o huye y se considera fuera de combate., source: {manual: khemri, printed_page: 81, section: Lobos Gigantes}}
    source: {manual: khemri, printed_page: 81, section: Lobos Gigantes}
band_rules:
  - {id: hobgoblin-traitors, name: Traidores, effect: Por cada Hobgoblin que no esté trabado al inicio de cada fase de combate tira 1D6. Con 1 cambia de bando y pasa al control del oponente; con 2-5 no puede cargar ni disparar ese turno aunque sí hacer otras acciones; con 6 no vuelve a chequear durante la batalla., source: {manual: khemri, printed_page: 78, section: Reglas especiales de los Incursores Hobgoblin}}
  - {id: hobgoblin-wolf-riders, name: Jinetes de Lobo, effect: Todos los miembros pueden montar lobos gigantes., source: {manual: khemri, printed_page: 78, section: Reglas especiales de los Incursores Hobgoblin}}
  - {id: poisoned-daggers-rule, name: Dagas Envenenadas, effect: Comunes, coste 15, Fuerza del usuario. Se usan por pares y conceden un ataque adicional; no permiten más armas. Conceden +1 Iniciativa en cuerpo a cuerpo. El veneno no se agota y un 6 natural para impactar causa una herida automática sin tirar para herir., source: {manual: khemri, printed_page: 78, section: Dagas Envenenadas}}
  - {id: hobgoblin-skill-moving-shot, name: Disparo en Marcha, effect: No sufre penalizador por Movimiento al disparar, incluso montado en lobo gigante., source: {manual: khemri, printed_page: 79, section: Habilidades Especiales de los Hobgoblins}}
  - {id: hobgoblin-skill-disguised, name: Disimulado, effect: Se despliega después del rival en cualquier lugar fuera de su línea de visión y a más de 30 cm de enemigos., source: {manual: khemri, printed_page: 79, section: Habilidades Especiales de los Hobgoblins}}
  - {id: hobgoblin-skill-unpredictable, name: Impredecible, effect: Declara impredecible uno de sus ataques y este no puede ser parado., source: {manual: khemri, printed_page: 79, section: Habilidades Especiales de los Hobgoblins}}
  - {id: hobgoblin-skill-wolf-tamer, name: Domador de Loboz, effect: Puede dirigir un lobo gigante sin montarlo; no cuenta para el máximo de banda. Si lo monta puede repetir chequeos de montar fallidos pero acepta el segundo resultado; si desmonta, el lobo supera Liderazgo o queda sin amo., source: {manual: khemri, printed_page: 79, section: Habilidades Especiales de los Hobgoblins}}
  - {id: hobgoblin-skill-ambush, name: Emboscar, effect: Solo Khann. Tras desplegar y antes del primer turno, 1D3 miembros realizan un turno gratuito de Movimiento., source: {manual: khemri, printed_page: 79, section: Habilidades Especiales de los Hobgoblins}}
