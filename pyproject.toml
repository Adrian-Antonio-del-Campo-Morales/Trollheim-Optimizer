[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trollheim-simulator"
version = "4.2.0"
description = "Simulador Monte Carlo de combates de Trollheim"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "openpyxl>=3.1,<4",
    "PyYAML>=6,<7",
]

[project.gui-scripts]
trollheim = "trollheim_simulator.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/trollheim_simulator/knowledge/bands" = ["sources/knowledge/bands/*.yaml"]
"share/trollheim_simulator/knowledge/catalog" = ["sources/knowledge/catalog/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
